<div class="branch"><strong>考点 1 · 什么是马克思主义</strong><h3>1. 马克思主义的科学内涵</h3><ol><li>由马克思、恩格斯创立并为后继者所不断发展的科学理论体系。</li><li>关于自然、社会和人类思维发展一般规律的学说。</li><li>关于社会主义必然代替资本主义、最终实现共产主义的学说。</li><li>关于无产阶级解放、全人类解放和每个人自由而全面发展的学说。</li><li>无产阶级政党和社会主义国家的指导思想。</li><li>指引人民创造美好生活的行动指南。</li></ol><div class="callout">马克思主义的三个组成部分：马克思主义哲学（基础）、马克思主义政治经济学、科学社会主义（核心、结论）。</div><h3>2. 马克思主义基本原理</h3><p>对马克思主义立场观点方法的集中概括，是在其形成、发展和运用过程中经过实践反复检验而确立起来的具有普遍真理性的理论。</p></div>
<div class="branch"><strong>考点 2 · 马克思主义的创立与发展</strong><h3>1. 创立条件</h3><div class="tree"><div class="branch"><strong>社会根源 · 客观条件</strong><p>资本主义经济的发展为马克思主义的产生提供经济、社会历史条件。</p></div><div class="branch"><strong>阶级基础 · 现实需求</strong><p>无产阶级在反抗资产阶级剥削和压迫的斗争中逐步走向自觉，迫切渴望科学理论指导。</p><p>三大工人运动：法国里昂工人起义、英国宪章运动、德国西里西亚纺织工人起义。它们标志着现代无产阶级作为独立的政治力量登上历史舞台。</p><p>觉醒的无产阶级迫切需要总结和升华自身斗争经验，形成科学的革命理论，以指导自身的解放斗争。</p></div><div class="branch"><strong>思想渊源 · 主观条件</strong><p>马克思、恩格斯的革命实践和对人类文明成果的继承与创新。</p><p><b>直接理论来源：</b>德国古典哲学、英国古典政治经济学、英法空想社会主义。</p><p><b>自然科学前提：</b>细胞学说、能量守恒与转化定律、生物进化论。</p></div></div><h3>2. 创立过程 · 主要著作</h3><ol><li>《德法年鉴》上的论文：马克思、恩格斯完成从唯心主义到唯物主义、从革命民主主义到共产主义的转变，为创立马克思主义奠定思想前提。</li><li>《神圣家族》：马克思、恩格斯的第一部合著。</li><li>《德意志意识形态》：首次系统阐述历史唯物主义的基本观点。</li><li>《共产党宣言》：标志马克思主义公开问世；共产主义者同盟是马克思和恩格斯建立的第一个无产阶级政党。</li><li>《关于费尔巴哈的提纲》：包含新世界观天才萌芽的第一个文件；“哲学家们只是用不同的方式解释世界，问题在于改变世界”。</li><li>《资本论》：马克思主义最厚重、最丰富的著作，被誉为“工人阶级的圣经”。</li><li>《法兰西内战》：科学总结巴黎公社的历史经验。</li><li>《哥达纲领批判》：进一步丰富科学社会主义学说。</li><li>《反杜林论》：全面阐述马克思主义理论体系，被称为马克思主义的“百科全书”。</li></ol><h3>3. 发展</h3><div class="tree"><div class="branch"><strong>列宁</strong><p>指出经济政治发展不平衡已成为资本主义发展的绝对规律；提出社会主义革命可能在一国或数国首先发生并取得胜利的论断。</p></div><div class="branch"><strong>十月革命</strong><p>实现社会主义从理想到现实的伟大飞跃，开辟人类历史新纪元。</p></div><div class="branch"><strong>中国</strong><p>马克思主义中国化时代化；本土化和时代化是马克思主义创新发展的根本路径。习近平新时代中国特色社会主义思想的世界观、方法论：“六个必须坚持”。</p></div></div></div>
<div class="branch"><strong>考点 3 · 马克思主义的基本特征</strong><div class="tree"><div class="branch"><strong>科学的理论 · 科学性</strong><p>正确反映自然、社会和人类思维发展的本质和规律；具有辩证唯物主义和历史唯物主义的科学世界观和方法论基础。</p></div><div class="branch"><strong>人民的理论 · 人民性</strong><p>人民性是马克思主义的本质属性，人民至上是其政治立场；其人民性以阶级性为深刻基础，是无产阶级先进性的体现。</p></div><div class="branch"><strong>实践的理论 · 实践性</strong><p>从实践中来、到实践中去，在实践中接受检验并随实践不断发展；实践观点是首要和基本的观点。</p></div><div class="branch"><strong>发展的理论 · 发展性</strong><p>具有与时俱进的理论品质，不断吸收人类最新文明成果来充实和发展自己。</p></div></div><p class="callout">基本特征的概括：科学性与革命性的统一。革命性是内在品质，是人民性、实践性、发展性的应有之义和必然要求；革命性建立在科学性基础上，与科学性高度统一。</p></div>
<div class="branch"><strong>考点 4 · 马克思主义的当代价值</strong><p>观察当代世界变化的认识工具；指引当代中国发展的行动指南；引领人类社会进步的科学真理。</p><p>马克思主义之所以行，根本原因在于它是科学的世界观和方法论。</p><div class="callout">辨析：马克思主义提供科学的方法，不直接提供可以照搬的现成、具体方案；运用时需要结合本国国情。</div></div></div>`,true,`<div class="actions"><span class="status">图谱第 3 页 / 导论</span><button class="primary" data-go="map4">下一张：哲学基本问题 →</button></div>`)}

function map4(){return header('思维导图','马原 · 唯物论','map')+sheet('map-philosophy',`<div class="eyebrow">第一篇 / 马克思主义基本原理 · 图谱第 4 页</div><h2>一、唯物论</h2><p class="lead">按原图第 4 页组织；分支与旁注均予以保留。</p><div class="tree">
<div class="branch"><strong>考点 1：哲学基本问题（世界是什么？）</strong><p>存在和思维的关系问题，包括两个方面。</p><div class="callout">在这个问题上：思维＝意识＝精神；存在＝物质。</div><h3>1. 第一方面</h3><p>存在和思维、物质和意识谁为本原的问题，即何者为第一性（划分唯物主义和唯心主义）。</p><ol><li>唯物主义：物质第一性（世界的本原是物质、存在，即唯物主义一元论）。</li><li>唯心主义：精神第一性（世界的本原是精神、意识、思维，即唯心主义一元论）。<ul><li>主观唯心主义：世界本原是人的感觉、观念。关键词：感觉、精神、心、观念。</li><li>客观唯心主义：世界本原是脱离人而单独存在的某种客观精神。关键词：道、理、宇宙精神、绝对观念、上帝、神。</li></ul></li></ol><h3>2. 第二方面</h3><p>思维能否正确认识存在，即思维和存在有无同一性（划分可知论和不可知论）。</p><ol><li>可知论：思维和存在具有同一性；思维能正确地反映存在，人能认识或彻底认识世界。<br>“世界只有尚未认识之物，没有不可认识之物”（2021—17）</li><li>不可知论：思维和存在不具有同一性；思维不能正确地反映存在，人不能认识或彻底认识世界。</li></ol><div class="callout"><b>政治素养：</b><ol><li>对立＝区别／不同＝第一性＝本原＝先……后……（区分唯心主义、唯物主义）</li><li>同一性＝有关系／有联系／意识可以转化为物质（区分可知论、不可知论）</li><li>第一性≠更重要≠与社会生活的关系更密切</li><li>物质和意识只有在“何为第一性”上是绝对对立的，超过这个范围就是相对的。</li><li>唯物主义一元论同唯心主义一元论对立的根本点在于：世界本原问题。</li></ol><b>易错点：（可知论与不可知论）</b><ol><li>人类无法充分认识客观世界（×）</li><li>人们无法完全认识不断发展着的物质世界（×）</li><li>人们只能认识个别的、有限的东西（×）</li></ol></div></div>
<div class="branch"><strong>考点 2：哲学重要问题（世界怎样存在？）</strong><h3>1. 辩证法</h3><ol><li>世界是联系发展的，发展的根本原因在于事物的内部矛盾。</li><li>特点：联系、发展、全面、承认矛盾。</li></ol><h3>2. 形而上学</h3><ol><li>世界是孤立静止的，否认内部矛盾的存在和作用。</li><li>特点：孤立、静止、片面、否认矛盾。</li></ol><div class="callout"><b>政治素养：</b>唯物主义、唯心主义都可以和形而上学、辩证法结合，因此我们要坚持唯物论与辩证法的统一。<br><b>易错点：</b><ol><li>唯物主义都是辩证法、唯心主义都是形而上学（×）</li><li>唯物主义、唯心主义和辩证法、形而上学是对哲学基本问题两个方面的不同回答（×）</li></ol></div></div>
<div class="branch"><strong>考点 3：物质观</strong><h3>1. 物质范畴是一切唯物主义哲学的理论基石</h3><h3>2. 探索过程</h3><ol><li>古代朴素唯物主义：把物质等同于具体的物质形态。</li><li>近代形而上学唯物主义：把物质等同于物质的微观结构层次——原子。</li><li>现代辩证唯物主义：从无限多样的物质现象中抽象出共同的特性，从哲学上作了最高概括。客观实在性是物质最本质的规定（2019—17）。</li></ol><div class="callout"><b>政治素养：</b>旧唯物主义＝“半截子”的唯物主义＝不彻底的唯物主义。把某种具体或几种物质当作世界本原。<br><b>易错点：</b><ol><li>机械唯物主义：形而上学唯物主义</li><li>庸俗唯物主义：意识是人的分泌物，意识等同于物质。</li><li>“客观实在”就是人类可以感知的自然事物／物质的具体形态和结构／可感知的东西或看得见、摸得着的实物（×）</li></ol></div><h3>3. 马克思、恩格斯实现了物质观上的重大变革</h3><ol><li>科学总结了哲学和自然科学发展的成果，继承了以往唯物主义关于世界物质性的基本观点。</li><li>批判了旧唯物主义对物质世界的直观、消极、机械的理解。</li><li>强调要用辩证的观点把握世界，特别是要从实践出发去把握现实世界，从自然存在和社会存在的统一中把握世界的物质性。</li><li>深刻揭示了社会存在的客观实在性，克服了旧唯物主义物质观局限于自然领域的缺陷，把唯心主义从社会历史领域中彻底驱除出去。</li></ol><h3>4. 科学的物质观</h3><ol><li>马克思主义的“物质”范畴是一个高度抽象的哲学概念，是对世界上客观存在的各种事物共同本质的概括。</li><li>恩格斯：从个性与共性的关系把握（初步概括）。自然科学物质概念与哲学物质概念＝个性与共性的关系。</li><li>列宁：从物质与意识的关系把握（全面科学的规定）。物质是标志客观实在的哲学范畴，这种客观实在：①是人通过感觉感知的；②不依赖于我们的感觉而存在；③为我们的感觉所复写、摄影、反映。</li></ol><div class="callout"><b>政治素养：</b><ol><li>共性＝普遍＝一般＝抽象（比如：水果、人、动物）</li><li>个性＝特殊＝个别＝具体（比如：苹果、香蕉、梨）</li></ol>物质的共同特性（唯一特性）是客观实在性，它不依赖于人类的意识而存在，并能为人类的意识所反映（2020—17、2026—17）。</div><h3>5. 意义</h3><ol><li>坚持了唯物主义一元论，同唯心主义一元论和二元论划清了界限。</li><li>坚持了能动的反映论和可知论，批判了不可知论。</li><li>体现了唯物论和辩证法的统一，克服了形而上学唯物主义的缺陷。马克思主义物质观体现的唯物辩证法：①从个性中看到共性；②从相对中找到绝对；③从暂时中发现永恒。</li><li>体现了唯物主义自然观与历史观的统一，为彻底的唯物主义奠定了理论基础。</li></ol><div class="callout"><b>政治素养：</b><ol><li>“半截子”的唯物主义＝马克思主义以前的唯物主义：自然观上唯物（认为物质决定意识），历史观上唯心（认为社会意识决定社会存在）；不了解实践的作用。</li><li>彻底的唯物主义：马克思主义以实践为基础揭示了人类社会的物质性，实现了唯物主义自然观和历史观的统一。</li></ol></div></div></div>`,true,`<div class="actions"><button class="subtle" data-go="map">← 上一张：导论</button><span class="status">图谱第 4 页文字版</span><button class="subtle" data-go="map-motion">下一张：运动、时空与实践 →</button></div>`)}
function notes(){const groups=[{title:'考点 1–2 · 哲学基本问题',pages:'原资料第 2–5 页',items:[['哲学基本问题与概念辨析','第 2 页','note'],['物质与意识的对立和转化','第 3 页','note-page:3'],['唯物主义、唯心主义与真题拆解','第 4 页','note-page:4'],['课后测试：判断、连线、选择','第 4–5 页','original-quiz']]},{title:'考点 3 · 物质观',pages:'原资料第 5–9 页',items:[['唯物主义的三种形态','第 5 页','material:5'],['自然观与历史观、个性与共性、客观实在性','第 6 页','material:6'],['客观实在性与经典真题','第 7 页','material:7'],['真题拆解续篇','第 8 页','material:8'],['课后测试：填空、判断','第 8–9 页','material-quiz']]},{title:'考点 4–5 · 运动观、时空观',pages:'原资料第 9–14 页',items:[['物质、运动与时空的关系','第 9 页','motion-original:9'],['时空与时空观念、时空的特点','第 10 页','motion-original:10'],['物质、运动与时空的统一','第 11 页','motion-original:11'],['时空关系辨析与经典真题','第 12 页','motion-original:12'],['课后测试：填空、判断、连线','第 13–14 页','motion-original-quiz']]}];return header('学霸笔记','第一章 · 世界的物质性及发展规律')+`<div class="note-directory"><div class="directory-intro"><div><span class="eyebrow">CONTENTS / 目录</span><h2>选择要学习的内容</h2><p>点击目录直接进入相应的笔记或课后测试。</p></div><span class="tag">原资料第 2–14 页</span></div>${groups.map((g,i)=>`<details class="note-directory-group" open><summary><span class="directory-number">0${i+1}</span><span class="directory-title">${g.title}<small>${g.pages}</small></span><span class="directory-toggle" aria-hidden="true"></span></summary><div class="directory-items">${g.items.map(([title,pages,target])=>`<button class="directory-item" data-go="${target}"><span>${title}</span><span class="directory-page">${pages} <span aria-hidden="true">→</span></span></button>`).join('')}</div></details>`).join('')}</div>`}
function notePage(n){n=Math.max(3,Math.min(4,n));const body=n===3?`<div class="original-note"><div class="note-border"><p><b>【大白话举例】</b>比如：男女是从性别来说的，胖瘦是从身形来说的。你不能说，男的<span class="note-red">就是</span>胖的，女的<span class="note-red">就是</span>瘦的。因此，不能说唯物主义就是辩证法，唯心主义就是形而上学。</p><p class="note-blue"><b>【命题规律】</b> 考关系辨析题。</p><p>①唯物主义都是辩证法、唯心主义都是形而上学（×）</p><p>②唯物主义、唯心主义和辩证法、形而上学是对哲学基本问题两个方面的不同回答（×）</p><p>注：哲学基本问题两个方面的不同回答对应——唯物主义、唯心主义和可知论、不可知论</p></div><h4>4.物质与意识的对立（第一性的表现）</h4><div class="note-border note-shade"><p>物质和意识只有在世界本原问题上是绝对对立，超过这个范围便是相对的。</p><p>（1）“绝对”——强调它们有区别</p><p>（2）“相对”——强调它们有联系</p><p>→物质和精神何为<span class="note-red">第一性</span>，即探讨谁是世界的<span class="note-red">本原</span>。世界本原要么是物质，要么是意识。在谁为第一性方面，二者水火不容，体现了绝对对立。</p><p>→存在和思维有无<span class="note-red">同一性</span>，即探讨世界（物质）能不能被我们认识（意识）。也就是说物质和意识可以相互转化，它们有关系，体现了相对对立。</p></div><h4>5.物质与意识的辩证转化（同一性的表现）</h4><div class="note-border note-shade"><p>（1）<b>物质转化为意识：</b>强调物质可以被人的意识所反映。比如，你看到一个帅气小哥哥（物质），然后你的大脑对其能动反映，形成认识（他眼睛大、鼻子挺）</p><p>（2）<b>意识转化为物质：</b>强调意识可通过<span class="note-red">实践</span>被改造为物质。比如，考研想法（意识）通过实践变成现实（考上研究生）</p></div><h4>6.唯物主义、唯心主义</h4></div>`:`<div class="original-note"><div class="note-border note-shade"><p>（1）<b>唯物主义：</b>世界的本原是<span class="note-red">物质/存在</span></p><p>（2）<b>唯心主义：</b>世界的本原是<span class="note-red">意识/精神/思维</span></p><p>①主观唯心：从人出发——人的感觉、精神、心、观念</p><p>②客观唯心：非人出发——道、理、宇宙精神、绝对观念、上帝、神</p><p>【注】主观唯心、客观唯心都认为意识是世界本原</p></div><h3 class="note-blue">【经典真题拆解】</h3><div class="note-border"><p>（2009-1，单选）物质和意识的对立只有在非常有限的范围内才有绝对的意义，超过这个范围便是相对的了。这个范围是指</p><p>A.物质和意识何者为第一性<br>B.物质和意识是否具有同一性<br>C.物质和意识何者更重要<br>D.物质和意识何者与社会生活的关系更密切</p><p><b>【答案】</b>A</p><p><b>【拆解】</b></p><p>①抓词：读懂题干，找对题干所指代词是谁：题干中“这个范围”是指前一句话中的“在非常有限的范围内”。而“在非常有限的范围内”特指“在物质和意识对立”这个有限范围</p><p>②想点：翻译题干——对立=哲学基本问题第一方面=本原=第一性=划分唯物主义、唯心主义</p><p>③排坑：回到选项中，先排除 CD 表述本身错误的选项（第一性≠更重要/更密切）。然后在表述正确的选项中，找题干中“对立”的同义替换，锁定 A 选项。</p><p>【拓展】假如题干最后一句话改为“这里的相对是指”，答案应该选 B。因为相对强调的是物质和意识有关系，能转化。所以要选物质和意识是否有同一性。</p></div><h3 class="note-blue">【课后测试题】</h3><p>判断题、连线题、选择题按原题接入下方练习。</p></div>`;return header('哲学基本问题',`学霸笔记 · 原资料第 ${n} 页`,'notes')+sheet('note-source-'+n,body,false,`<div class="actions"><button class="subtle" data-go="${n===3?'note':'note-page:3'}">← 上一页</button>${n===3?'<button class="primary" data-go="note-page:4">下一页 →</button>':'<button class="primary" data-go="original-quiz">读完了，开始做原题 →</button>'}</div>`)}
function originalQuiz(){let qs=[['人类无法充分认识客观世界','×'],['人们无法完全认识不断发展着的物质世界','×'],['人们只能认识个别的、有限的东西','×'],['唯物主义都是辩证法，唯心主义都是形而上学','×'],['唯物主义、唯心主义和辩证法、形而上学是对哲学基本问题两个方面的不同回答','×'],['心诚则灵，心不诚则不灵','主观唯心'],['我思故我在','主观唯心'],['意念移物','主观唯心'],['世界是上帝意志的创造物','客观唯心'],['世界是观念的集合','主观唯心'],['世界是绝对观念/绝对精神的外化','客观唯心'],['（1992、1995年理科，单选）唯物主义一元论同唯心主义一元论对立的根本点在于','世界本原问题']];return header('课后测试题','哲学基本问题 · 原资料第 4—5 页','note-page:4')+`<div class="quiz"><p class="status">判断题、连线题和选择题；选择后提交查看答案。</p>${qs.map((q,i)=>`<section class="question" data-original-question="${i}" data-answer="${q[1]}"><h3>${i===0?'判断题':i===5?'连线题：判断所属类别':i===11?'选择题':''}</h3><p>${i<5?i+1:i<11?i-4:1}. ${q[0]}${i<5?'（　）':''}</p>${(i<5?['√','×']:i<11?['主观唯心','客观唯心']:['世界是否可知问题','意识本质问题','世界本原问题','实践本质问题']).map((v,j)=>`<label class="option"><input type="radio" name="oq${i}" value="${v}"> ${i===11?String.fromCharCode(65+j)+'. ':''}${v}</label>`).join('')}<div class="original-result"></div></section>`).join('')}<div class="actions"><button class="subtle" data-go="note-page:4">返回笔记</button><button class="primary" id="original-submit">提交答案</button><button class="subtle" id="original-retry" hidden>重练错题</button></div></div>`}
function note(){return header('哲学基本问题','学霸笔记 · 原资料第 2 页','notes')+sheet('note-philosophy-original-2',`<div class="original-note"><h2 class="note-chapter">第一章　世界的物质性及发展规律</h2><p class="note-center"><b class="note-highlight">【唯物论】</b></p><h3 class="note-title"><u>考点 1-2：哲学基本问题</u> <small>（考点定位：选择题考点｜理解｜★★★）</small></h3><h3 class="note-blue">【复盘笔记】</h3><h4>1.世界是什么？对应<span class="note-red">哲学基本问题</span>（包括两方面）</h4><div class="note-border"><p>（1）第一方面（第一性=本原=先后=对立/区别/不同）：<span class="note-shade"><u>唯物主义、唯心主义</u></span></p><p>（2）第二方面（同一性=有关系/有联系/意识可以反映物质）：<span class="note-shade"><u>可知论、不可知论</u></span></p><p>【注】第一性：问谁是世界本原，谁先谁后，划分出了<u>唯物主义和唯心主义</u></p><p class="note-indent">同一性：问人能不能认识世界，意识能不能反映物质，划分出了<u>可知论和不可知论</u></p><p><b class="note-blue">【命题规律】</b>考同义替换题、概念偷换题。</p><p>①第一性=本原。题干问“第一性、对立”，要去选项中找“本原、唯物主义和唯心主义”</p><p>②命题人常把“第一性”和“更重要”混淆。记住：<b class="note-red">第一性≠更重要</b>（不要偷换概念）</p></div><h4>2.世界怎样存在？对应<span class="note-red">哲学重要问题</span>：<u>辩证法、形而上学</u></h4><h4>3.概念辨析：</h4><div class="concept-grid"><div class="concept-chart"><svg viewBox="0 0 340 260" role="img" aria-label="辩证法、形而上学与唯物主义、唯心主义的四种组合：A、B、C、D"><g fill="none" stroke="#18a966" stroke-width="2"><path d="M95 42 L63 237 M209 42 L177 237 M17 110 H321 M17 195 H321"/></g><g fill="#4ac5b7"><rect x="48" y="8" width="80" height="35" rx="4"/><rect x="159" y="8" width="92" height="35" rx="4"/><rect x="232" y="92" width="98" height="35" rx="4"/><rect x="232" y="177" width="98" height="35" rx="4"/></g><g fill="#fff" font-size="16" font-weight="bold" text-anchor="middle"><text x="88" y="31">辩证法</text><text x="205" y="31">形而上学</text><text x="281" y="115">唯物主义</text><text x="281" y="200">唯心主义</text></g><g fill="#475d54"><circle cx="84" cy="110" r="4.5"/><circle cx="198" cy="110" r="4.5"/><circle cx="70" cy="195" r="4.5"/><circle cx="184" cy="195" r="4.5"/></g><g fill="#1599d1" font-size="18"><text x="63" y="105">A</text><text x="215" y="105">B</text><text x="53" y="220">C</text><text x="199" y="220">D</text></g></svg></div><div class="concept-explain"><p>（1）唯物主义、唯心主义：讲世界是什么</p><p>（2）辩证法、形而上学：讲世界怎样存在</p><p>【注】这两组概念分别对应两个不同的维度。唯物主义、唯心主义和辩证法、形而上学能组合成 4 种情况。</p><p><u>马克思坚持的是唯物辩证法，即 A 这种情况。</u></p></div></div></div>`,false,`<div class="actions"><span class="status">已按原资料重做第 2 页。</span><button class="subtle" data-go="note-page:3">继续阅读第 3 页 →</button><button class="primary" id="startquiz">继续阅读 →</button></div>`)}
function motionMap(){return header('思维导图','马原 · 唯物论','map4')+sheet('map-motion',`<div class="eyebrow">第一篇 / 马克思主义基本原理 · 图谱第 5 页</div><h2>一、唯物论：五大观点</h2><p class="lead">依据原图第 5 页，按分支整理。</p><div class="tree"><div class="branch"><strong>考点 4：运动观</strong><h3>1. 运动</h3><p>运动是标志一切事物和现象变化及其过程的哲学范畴。运动是物质的存在方式和根本属性。</p><h3>2. 物质的根本属性是运动（物质和运动不可分割）</h3><ol><li>运动是物质的运动，没有无物质的运动。假设有：唯心主义。</li><li>物质是运动着的物质，没有不运动的物质。假设有：形而上学。</li><li>物质是一切运动变化和发展过程的实在基础和承担者。</li></ol><div class="callout"><b>政治素养：</b><ol><li>唯心主义运动观：认为运动是“心、意识、精神”在动。</li><li>唯物主义运动观：认为运动是“物质”在动。</li><li>唯物主义运动观和唯心主义运动观的根本区别在于：是否承认运动是物质的运动。</li><li>物质是运动的载体、承担者、主体、内容、基础。</li></ol></div><h3>3. 绝对运动和相对静止（2015—18）</h3><p>（1）相对静止：运动的特殊状态。</p><ol><li>是物质运动在一定条件下的稳定状态，包括空间的相对位置和事物的根本性质暂时不变。</li><li>是运动的衡量尺度（2013—1）。</li><li>是事物存在和发展的必要条件；是人们认识和利用事物的前提；是过去运动的结果和未来运动的出发点。</li></ol><p>（2）辩证统一（2014—17）</p><ul><li>相互区别：绝对运动——整个物质世界都是运动的，具有绝对性、无条件性、变动性；相对静止——具体事物的运动，具有相对性、有条件性、稳定性。</li><li>相互联系：相互依赖、相互渗透、相互包含，“动中有静、静中有动”；无条件的绝对运动和有条件的相对静止构成了对立统一的关系。</li><li>不能割裂两者关系：否认绝对运动→形而上学不变论：“刻舟求剑”；否认相对静止→相对主义诡辩论：“人连一次也不能踏进同一条河流”。</li></ul></div><div class="branch"><strong>考点 5：时空观</strong><h3>1. 时间和空间</h3><ol><li>时间：物质运动的持续性、顺序性，特点是一维性（2016—18）。</li><li>空间：物质运动的广延性、伸张性，特点是三维性。</li></ol><div class="callout">物质运动与时间和空间的不可分割，证明了时间和空间的客观性。</div><h3>2. 时间和空间是运动着的物质的基本存在形式（2015—17、2022—19）</h3><ol><li>物质运动总是在一定的时间和空间中进行的，没有离开物质运动的“纯粹”时间和空间。</li><li>也没有离开时间和空间的物质运动。</li></ol><h3>3. 时空的特点（2014—17）</h3><ul><li>时空是有限的、相对的：具体物质形态的时空是有限的（相对的、有条件的）。如人的时间是有限的，终会老去。空间也是有限的，人只能长这么高、这么大。</li><li>时空是无限的、绝对的：整个物质世界的时空是无限的（2021—17）；时空的客观实在性是绝对的、无条件的。</li></ul><h3>4. 物质、运动、时间、空间具有内在的统一性，不可分割（2022—18）</h3><div class="callout"><b>政治素养：</b><ol><li>时空的有限性和无限性（有限、无限看搭配）：具体→有限，整个→无限。整个物质世界的时空：绝对的／无条件的／无限的；具体事物的时空：相对的／有条件的／有限的。</li><li>时空≠时空观念（前者是客观的，后者是人们对时空的认识，是主观的）。</li><li>空间的观念随着人的认识发展而拓展。</li><li>物质、运动、时空：三兄弟，手牵手，不可分！①时间、空间、物质、运动相互不可分割；②空间的性质依赖于物质的分布及其运动状态（2020—17）；③时间和空间是通过物质运动的变化表现出来的（2014—17）；④物质运动与时间和空间具有内在的统一性。</li></ol></div><div class="callout"><b>易错点：（注意固定搭配）</b><ol><li>运动是物质的存在方式或根本属性／固有属性（√）</li><li>运动就是物质，物质就是运动（×）</li><li>绝对静止、相对运动（×，绝对运动，相对静止）</li><li>静止是运动的衡量尺度（√）</li><li>静止是运动的基础和承担者（×）</li><li>物质运动形式具有多样性，如物理、机械、化学、社会运动等（√）</li><li>时间和空间是运动着的物质的基本存在形式（√）</li><li>时间和空间是标示物质运动的观念形式（×）</li><li>脱离物质运动“纯粹”的时空是不存在的（√）</li><li>运动具有一维性（×，时间具有一维性）</li><li>时空的客观实在性是相对的（×，客观实在性是绝对的、无条件的）</li><li>时间和空间是有限的，物质运动是永恒的（×，整个物质世界的时空是无限的，具体物质运动的时空是有限的）</li></ol></div></div><div class="branch"><strong>考点 6：实践观（物质世界的二重化）</strong><h3>1. 世界分化为自然界与人类社会</h3><ol><li>人类的出现是自然史上的一个巨大飞跃。这个飞跃的关键在于人的劳动，它在从猿到人的转变中起到了决定性作用（“劳动创造了人本身”）。</li><li>人类社会是最高级的物质存在形态。人类社会与自然界的不同主要在于：①在自然界中一切都是自发产生的；②人类社会中一切都打着人的意识的印记，是人有目的的实践活动的结果。</li><li>自然界与人类社会不是截然分开的，而是交叉重叠和相互作用的。</li></ol><div class="callout"><b>政治素养：</b>自然界先于人类而存在。<br><b>易错点：</b><ol><li>自然界和人类社会相互利用（×，自然不会利用人）</li><li>自然界能够自发地满足人的需要／要求（×，人需要在尊重规律的前提下，发挥主观能动性，去认识世界，然后通过实践改造世界来满足自己的需求）</li></ol></div><h3>2. 世界分化为客观世界和主观世界</h3><ol><li>客观世界是不依赖于人的思想意识而存在的现实世界，包括自然界和人类社会。</li><li>主观世界是指人的意识、观念世界，是人的头脑反映和把握物质世界的精神活动的总和。①主观世界是人的认知、情感、意志的统一体；②主体的观念、愿望、情感、意志、目的、信念等都是主观世界的不同表现形式。</li><li>二者关系：①主观世界从客观世界中分化出来，具有相对独立性；②主观世界并非独立存在的实体，也不是一个超然于客观世界而孤立存在的世界；③主观世界不能完全脱离客观世界，而是从属于客观世界；④主观世界是对客观世界的反映，并反作用于客观世界。</li></ol><div class="callout"><b>政治素养：</b><ol><li>自然界和人类社会都属于物质世界／客观世界，都具有客观性。因此，人类社会也是客观的。</li><li>主观世界指人的意识活动，是主观的。</li></ol><b>易错点：</b><ol><li>自然界属于客观世界，而人类社会属于主观世界（×，前半句话正确，后半句话错误）</li><li>人可以创造／消灭／毁灭自然（×，人可以利用、改造、影响自然）</li><li>自然界和人类社会都具有客观实在性（√）</li><li>人类的实践活动能够改变自然界的客观实在性（×）</li></ol></div><h3>3. 总结</h3><ol><li>不论是创造人本身的劳动，还是构成社会存在基础的物质生产，都是人改造世界的实践活动。</li><li>人的实践活动是自然界与人类社会、客观世界与主观世界相分化的关键，也是它们相统一的关键。</li><li>在实践活动中，人们始终在处理自然与社会、客观与主观的关系，力求克服二者的对立而达成它们的统一。</li><li>人类的实践活动是一个不断发展的过程，因而自然与社会、客观与主观的统一也是一个动态的历史的过程。</li></ol></div></div>`,true,`<div class="actions"><button class="subtle" data-go="map4">← 上一张：哲学基本问题与物质观</button><span class="status">图谱第 5 页文字版</span><button class="subtle" data-go="map-consciousness">下一张：意识与世界的物质统一性 →</button></div>`)}
function consciousnessMap(){return header('思维导图','马原 · 意识观与世界的物质统一性','map-motion')+sheet('map-consciousness',`<div class="eyebrow">第一篇 / 马克思主义基本原理 · 图谱第 6 页</div><h2>一、唯物论：五大观点</h2><p class="lead">按原图第 6 页组织，保留分支与旁注。</p><div class="tree"><div class="branch"><strong>考点 7：意识观（物质与意识的辩证关系）</strong><h3>1. 物质决定意识</h3><h4>意识的起源</h4><ol><li>自然界长期发展的产物（三个阶段）：一切物质所具有的反应特性→低等生物的刺激感应性→高等动物的感觉和心理→最终发展为人类的意识。</li><li>社会历史发展的产物：①社会实践，特别是劳动，在意识的产生和发展中起到决定性作用。劳动为意识的产生和发展提供了客观需要和可能。②在人们的劳动和交往中形成的语言促进了意识的发展。</li></ol><h4>意识的本质</h4><ol><li>本质：意识是人脑的机能和属性，是客观世界的主观映象（2012—1、2017—2）。①意识在内容上是客观的，在形式上是主观的；②意识是客观内容和主观形式的统一。</li><li>意识是物质的产物，但不是物质本身（意识≠物质）。①物质决定意识；②意识反作用于物质／意识可以转化为物质。</li></ol><div class="callout"><b>易错点：</b><ol><li>意识起源于人脑／意识是人主观自生的／意识可以脱离客观世界而存在（×，意识来源于物质世界）</li><li>意识是客观精神的主观映象（×，意识是客观世界的主观反映。“客观世界”是现实世界中真实存在的事物，而非精神的东西）</li><li>不论正确的意识还是错误的意识，都是客观世界的主观映象，都能在物质世界找到其“原型”（√）</li><li>鬼神观念是人脑对鬼神的虚幻反映（×，鬼神观念是对客观世界的歪曲反映）</li><li>正确的意识是客观的，错误的意识是主观的（×，客观强调意识的内容，主观强调意识的形式）</li><li>精神／意识的力量可以代替物质的力量（×，意识可以通过实践转化为物质，但它本身不能代替物质）</li></ol></div><h3>2. 意识对物质具有反作用（意识的能动作用）</h3><p>表现：①具有目的性和计划性；②具有创造性；③具有指导实践改造客观世界的作用；④具有调控人的行为和生理活动的作用。</p><h3>3. 主观能动性和客观规律性的辩证统一（2014、2021 分析题考点）</h3><p>（1）规律：规律是事物变化发展过程中本身所固有的内在的、本质的、必然的联系。</p><ul><li>自然规律：自发的、无意识的，没有人的参与（2021—2），如潮起潮落、太阳东升西落。</li><li>社会规律：自觉的、有意识的，需要人来推动（2014—2）。推动≠改变。</li><li>规律是客观的，不以人的意志为转移。承认规律的客观性，并不是说人在规律面前无能为力、无所作为；人能够通过自觉活动去认识规律，并按照客观规律去改造世界，以满足自身的需要。</li></ul><div class="callout">题目中：规律＝规律性＝必然性。</div><p>（2）两者关系（2017—1、2026—18）：①尊重客观规律是正确发挥主观能动性的前提（2022—17）；②只有充分发挥主观能动性，才能正确认识和利用客观规律；③实践是客观规律性和主观能动性统一的基础。</p><p>（3）如何发挥主观能动性？①从实际出发是正确发挥人的主观能动性的前提；②实践是正确发挥人的主观能动性的根本途径；③正确发挥人的主观能动性，还要依赖于一定的物质条件和物质手段。</p><p>（4）坚持遵循客观规律与发挥主观能动性相统一，要求充分发扬历史主动精神。</p><div class="callout"><b>政治素养：（2013—17）</b><ol><li>人不能创造、改变、消灭、摆脱规律，但可以认识、利用规律。</li><li>人虽然不可以改变规律，但是可以改变规律发挥作用的条件。</li><li>自然规律与社会规律都是客观的，都可以重复，没有谁比谁更重要的说法。</li><li>事物运动的规律是各种因素相互作用的结果（2026—2）。</li></ol><b>易错点：</b><ol><li>自然规律和社会规律是一样的／存在着惊人的相似性（×）</li><li>历史上发生作用的规律现实上也一定发生（×，规律的存在和发生作用是有条件的，如价值规律在共产主义社会不会发生作用，因为没有商品）</li><li>自然规律要依靠人的活动才能存在和发挥作用（×）</li><li>社会规律比自然规律更易于认识的规律（×）</li><li>自然规律因人的出现而改变／取决于人的观察结果（×，规律是客观的）</li></ol></div><h3>4. 意识与人工智能（2022—18）</h3><p>（1）人工智能（2024—17、2025—18）：①定义：把人的部分智能活动机器化，让机器具有完成某种复杂目标的能力；②实质：对人脑组织结构与思维运行机制的模仿，是人类智能的物化。</p><p>（2）人工智能是人的意识能动性的一种特殊表现，是人的本质力量的对象化、现实化。</p><p>（3）尽管人工智能可以模拟和扩展人脑的某些活动，但即使是计算能力最强大、最先进的智能机器，也达不到人类智能的层级，无法真正具有人的意识，不可能取代或超越人类智能。</p><p>（4）关系：</p><ol><li>人类意识是知情意的统一体，而人工智能只是对人类的理性智能的模拟和扩展，不具备情感、信念、意志等人类意识形式。</li><li>社会性是人的意识所固有的本质属性，而人工智能不可能真正具备人类的社会属性。机器人从根本上说是机器而不是人类，不可能具备自立、自主、自觉的社会活动；机器人难以成为独立的具有行为后果意识、自律意识、社会责任感的社会主体。</li><li>人类的自然语言是思维的物质外壳和意识的现实形式，人工智能难以完全具备理解自然语言真实意义的能力。</li><li>人工智能能够获得人类意识中可以化约为数字信号的内容，但人脑中总有许多东西是无法被化约的，比如潜意识。</li></ol><div class="callout"><b>政治素养：</b><ol><li>人工智能的出现表明，人类意识已经发展到能够把意识活动部分地从人脑中分离出来，物化为机器的物理运动从而延伸意识器官功能的新阶段。</li><li>人工智能，本质上是人造出来的机器／计算机，它只是按照程序来完成某些动作，没有人的意识，不可能取代或超越人类智能。</li><li>人的实践活动是一种有目的、有意识的活动，但人工智能没有意识，没有能动性，所以它不能从事实践活动。</li></ol><b>易错点（2025—18）：</b><ol><li>人工智能／机器人已经具备理性认识能力（×）</li><li>人工智能／机器人可以从事某些实践活动（×）</li><li>人工智能／机器人延伸和扩展了人脑的意识活动功能（√）</li><li>人脑中的所有东西都可以化约为数字信号（×）</li><li>人类的情感、信念、意志、创造性思维等已经可以被还原为数据信息及其基本算法（×）</li><li>最先进的智能机器已经可以取代和超越人类智能（×）</li></ol></div></div><div class="branch"><strong>考点 8：世界的物质统一性</strong><h3>1. 世界的统一性在于它的物质性，世界统一于物质</h3><h3>2. 世界的物质统一性体现在</h3><ol><li>自然界是物质的。自然界先于人类而存在，并不依赖人类意识而存在；无论是尚未进入人类实践活动范围的天然自然，还是已经被实践打上烙印的人化自然，都具有客观实在性。</li><li>人类社会本质上是生产实践基础上形成的物质体系。①人类社会是物质世界的一部分，是物质存在的一种特定形态；②人类社会的自然基础是物质的，人类获取生活资料的生产活动是物质的；③物质资料的生产方式构成了人类社会存在和发展的基础，集中体现着人类社会的物质性。</li><li>人的意识统一于物质（从意识的起源、本质、作用上看）。</li></ol><h3>3. 世界的物质统一性原理</h3><ol><li>世界是统一的，即世界的本原只有一个（2021—17）。</li><li>世界的统一性在于它的物质性（2018—17、2019—17、2022—18），即世界统一的基础是物质，而不是某种“始基”的物体。</li><li>世界的物质统一性是多样性的统一（2016—17、2019—17），而不是单一的无差别的统一。</li></ol><h3>4. 意义</h3><p>世界的物质统一性原理是辩证唯物主义最基本、最核心的观点，是马克思主义的基石。</p><div class="callout"><b>易错点：</b><ol><li>物质世界具有无限多样的属性（√）</li><li>未知世界和已知世界都是客观存在的，都统一于物质（√）</li></ol></div></div></div>`,true,`<div class="actions"><button class="subtle" data-go="map-motion">← 上一张：运动、时空与实践</button><span class="status">图谱第 6 页文字版</span><button class="subtle" data-go="map-dialectics-7">下一张：联系、发展与对立统一 →</button></div>`)}
function dialecticsMap(){return header('思维导图','马原 · 唯物辩证法','map-consciousness')+sheet('map-dialectics-7',`<div class="eyebrow">第一篇 / 马克思主义基本原理 · 图谱第 7 页</div><h2>二、唯物辩证法</h2><p class="lead">联系和发展是唯物辩证法的总观点和总特征。</p><div class="tree"><div class="branch"><strong>考点 1：联系（2014 分析题考点）</strong><h3>1. 内涵</h3><p>事物内部各要素之间和事物之间相互影响、相互制约、相互作用的关系。</p><h3>2. 特点（2018—17）</h3><p>（1）客观性：事物的联系是事物本身所固有的、不以人的意志为转移的。</p><p>（2）普遍性：①任何事物内部的不同部分和要素之间都是相互联系的，都具有内在的结构性；②任何事物都不能孤立存在，都同其他事物处于一定的联系之中；③整个世界是相互联系的统一整体。从无机界到有机界，从自然界到人类社会，任何事物都处在普遍联系、相互作用之中。</p><p>（3）多样性：①世界上的事物是多样的，事物之间的联系也是多样的；②事物联系的主要方式有：直接与间接、内部与外部、本质与非本质、必然与偶然等。</p><p>（4）条件性：条件是对事物存在和发展发生作用的诸要素的总和。①条件对事物发展和人的活动具有支持或制约作用：有利条件支持和促进事物的发展和人的活动；不利条件制约和阻碍事物的发展和人的活动。②条件是可以改变的：经过努力，可以化不利条件为有利条件，推动事物的发展。③改变和创造条件不是任意的：必须尊重事物发展的客观规律，不能强行去改变事物存在和发展的条件。</p><h3>3. 方法论</h3><ol><li>善于分析事物的具体联系，从区别中看到联系、联系中看到区别。</li><li>确立整体性开放性的观念，从动态中考察事物的普遍联系。</li></ol><div class="callout"><b>政治素养：</b><ol><li>事物的联系可以分为：①自在事物的联系：没有人参与（比如，动物和自然的关系）；②人为事物的联系：具有人化特点。</li><li>世界的普遍联系是通过“中介”来实现的（中介是多样的），“中介”就是事物相互联系的媒介、环节或桥梁。</li></ol><b>易错点：</b><ol><li>不论自在事物的联系还是人为事物的联系都是客观的（√）</li><li>事物之间的联系都是人为的，人为的联系具有主观能动性（×）</li><li>事物的普遍联系需要人们的正确认识才能实现（×，联系是客观的，与人的意识没有关系）</li><li>人们不可以随便地创造、改变、消灭事物的联系（√，联系具有客观性）</li><li>事物之间的普遍联系只有通过人这一中介才能实现（×，中介是多样的，自然界中事物的联系不需要人的参与，如动物和自然的关系）</li><li>任何事物之间都存在着直接联系（×，除了直接联系，还会有间接联系等）</li></ol></div></div><div class="branch"><strong>考点 2：发展</strong><h3>1. 发展的含义（2015—17）</h3><p>（1）发展是事物变化中前进的、上升的运动。</p><p>（2）实质：新事物的产生和旧事物的灭亡。</p><ul><li>内涵：新事物——合乎历史前进方向、具有远大前途的东西；旧事物——丧失历史必然性、日趋灭亡的东西。</li><li>新事物不可战胜（2012—17）：①新事物与环境的关系：新事物之所以新，是因为有新的要素、结构和功能，它适应已经变化了的环境和条件；旧事物之所以旧，是因为它的各种要素和功能已不适应环境和客观条件的变化，走向灭亡就成为不可避免的。②新旧事物的关系：新事物是在旧事物的“母体”中孕育成熟的，它既否定了旧事物中消极腐朽的东西，又保留了旧事物中合理的、适应新条件的因素，并添加了旧事物所不能容纳的新内容。③社会历史领域：新事物从根本上符合人民群众的利益和要求，能够得到人民群众拥护。</li></ul><div class="callout"><b>易错点：</b><ol><li>新旧事物区别的根本标志：同历史前进方向是否符合（√）</li><li>新事物产生于旧事物之后，是新出现的事物（×）</li><li>新事物和旧事物融合推动事物的发展（×，新事物必然战胜旧事物）</li></ol></div><h3>2. 发展的过程论（2019—2）</h3><p>（1）恩格斯：“世界不是既成事物的集合体，而是过程的集合体”。</p><p>（2）含义：任何事物都有其产生、发展和转化为其他事物的历史，都有它的过去、现在和未来。</p><div class="callout"><b>政治素养：</b>事物的发展是螺旋式上升或波浪式前进的过程。<br><b>易错点：</b><ol><li>事物的发展是循环往复的发展／事物的发展呈现出周而复始的总趋势（×）</li><li>事物的发展是直线式的、线性的发展／事物发展总是呈现出线性上升的状态（×）</li></ol></div><h3>3. 方法论</h3><p>用历史的眼光看问题，把一切事物都如实看作变化、发展的过程。</p></div><div class="branch"><strong>考点 3：对立统一规律（源泉和动力）</strong><h3>1. 地位：唯物辩证法的实质和核心</h3><ol><li>揭示了事物普遍联系的根本内容和变化发展的内在动力，从根本上回答了事物为什么会发展的问题。</li><li>贯穿了量变质变规律、否定之否定规律以及唯物辩证法基本范畴的中心线索，也是理解这些规律的“钥匙”。</li><li>提供了人们认识世界和改造世界的根本方法：矛盾分析方法。</li></ol><h3>2. 矛盾的同一性和斗争性的辩证关系原理（2015、2020、2021 分析题考点）</h3><h4>相互区别</h4><p>（1）同一性：矛盾着的对立面相互依存、相互贯通的性质和趋势【有条件的、相对的】。①相互依存：矛盾着的对立面相互依存，互为存在的前提，并共处于一个统一体中。②相互贯通：矛盾着的对立面相互贯通，在一定条件下可以相互转化。</p><p>（2）斗争性：矛盾着的对立面相互排斥、相互分离的性质和趋势【无条件的、绝对的】。具有多种多样的斗争形式：①对抗性；②非对抗性。</p><h4>相互联结、相辅相成</h4><p>（1）同一性包含斗争性：①同一性不能脱离斗争性而存在，没有斗争性就没有同一性；②同一性以差别和对立为前提，包含差别和对立的同一。</p><p>（2）斗争性寓于同一性：①斗争性也不能脱离同一性而存在，没有同一性也没有斗争性；②同一性制约着斗争的形式、规模和范围。</p><div class="callout"><b>政治素养：</b><ol><li>同一性是有条件的。比如，你和苏一有了考研这个条件，才会形成师生矛盾体，才会有师生关系（同一性即矛盾双方共处于统一体中，即有关系）。</li><li>斗争性是无条件的。在你和苏一的师生矛盾体中，你是学生，苏一是老师，你们的差异和分歧是无条件的，始终存在（斗争性即有不同、有分歧）。</li><li>斗争性寓于同一性之中。你和苏一的教学矛盾（斗争性）存在于考研师生关系（同一性）之中。如果你和苏一不是师生关系，那你们之间就不会发生教学矛盾。</li></ol><b>易错点：</b><ol><li>完全等同／绝对统一／绝对同一／无差别同一（×）</li><li>只有消除斗争才能实现事物之间的和谐（×，斗争性是绝对的，不可能消除斗争）</li></ol></div><h4>在事物发展中的作用</h4><p>（1）矛盾的同一性和斗争性相结合，构成了事物的矛盾运动，推动着事物的变化发展。</p><p>（2）同一性作用：①相互依存：同一性是事物存在和发展的前提，在矛盾双方中，一方的发展以另一方的发展为条件，发展是在矛盾统一体中的发展。②相互包含：同一性使矛盾双方相互吸取有利于自身的因素，在相互作用中各自得到发展。③相互贯通：同一性规定着事物转化的可能和发展的趋势。事物之所以能够转化，是由于事物内部矛盾双方具有相互贯通的关系。</p><p>（3）斗争性作用：①矛盾双方的斗争促进矛盾双方力量的变化，造成双方力量发展的不平衡，为对立面的转化、事物的质变创造条件。②矛盾双方的斗争是一种矛盾统一体向另一种矛盾统一体过渡的决定性力量。</p><p>（4）在事物发展过程中，矛盾的同一性和斗争性相互结合，共同发生作用，但在不同条件下，二者所处的地位会有所不同。①在一定的条件下，矛盾的斗争性可能处于主要方面；②在另外的条件下，矛盾的同一性可能处于主要方面。</p><div class="callout"><b>政治素养：</b>同一性是事物存在和发展的前提，先有师生矛盾统一体（同一性），才会有教学互动等后续的矛盾运动与发展变化。<br><b>易错点：</b><ol><li>矛盾的同一性和斗争性独自推动事物发展（×，同一性和斗争性共同推动事物发展）</li><li>斗争性是事物存在和发展的前提（×）</li><li>斗争性在事物发展中的作用始终处于主要地位（×，同一性和斗争性都能处于主要地位，只是条件不同）</li></ol></div></div></div>`,true,`<div class="actions"><button class="subtle" data-go="map-consciousness">← 上一张</button><span class="status">图谱第 7 页文字版</span><button class="subtle" data-go="map-dialectics-8">下一张：矛盾分析与量变质变 →</button></div>`)}
function dialecticsMap8(){return header('思维导图','马原 · 唯物辩证法','map-dialectics-7')+sheet('map-dialectics-8',`<div class="eyebrow">第一篇 / 马克思主义基本原理 · 图谱第 8 页</div><h2>二、唯物辩证法：三大规律</h2><div class="tree"><div class="branch"><strong>考点 3：对立统一规律（源泉和动力）</strong><h3>2. 矛盾的同一性和斗争性的辩证关系原理（续）</h3><p>内因和外因的辩证关系原理：（1）内因：事物发展的根本原因（内部矛盾）；（2）外因：事物发展的第二原因（外部矛盾）。</p><div class="callout"><b>易错点：</b>事物发展的根本原因在事物的外部（×，外因必须通过内因来发挥作用，内因是根本原因）。</div><h4>方法论意义</h4><ol><li>我们在观察和处理问题时，必须善于把二者结合起来，在斗争性中把握同一性，在同一性中把握斗争性。</li><li>正确把握和谐对事物发展的作用。和谐是矛盾的一种特殊表现形式，体现着矛盾双方的相互依存、相互促进、共同发展。和谐≠绝对同一，任何“同一”都是以差别和对立为内在前提的。</li><li>要大力发扬斗争精神。敢于斗争、善于斗争是马克思主义的鲜明特色，是中国共产党人的鲜明品格。</li></ol><h3>3. 矛盾的普遍性和特殊性的辩证关系原理（2018 分析题考点、2024）</h3><h4>相互区别</h4><p>（1）普遍性：①矛盾存在于一切事物中，存在于一切事物发展过程的始终；②旧的矛盾解决了，又产生新的矛盾，事物始终在矛盾中运动。</p><div class="callout"><b>易错点：</b>可以消除矛盾／共产主义没有矛盾（×，矛盾具有普遍性）。</div><p>（2）特殊性：第一，指各个具体事物的矛盾、每一个矛盾的各个方面在发展的不同阶段上各有其特点。</p><p>第二，矛盾力量的不平衡性原理：①事物由诸多矛盾构成：主要矛盾在矛盾体系中处于支配地位，对事物发展起决定作用；次要矛盾从属地位。②任何一对矛盾都有两个方面：主要方面在矛盾中处于支配地位、起主导作用；次要方面处于被支配地位、不起主导作用。③事物的性质是由主要矛盾的主要方面所决定的。</p><div class="callout"><b>易错点：</b>事物的性质取决于人们观察的角度（×，事物的性质由主要矛盾的主要方面所决定的）。</div><p>④方法论意义：“两点论”——不仅要看到矛盾双方的对立，而且要看到矛盾双方的统一；不仅要看到矛盾体系中存在主要矛盾、矛盾的主要方面，而且要看到次要矛盾、矛盾的次要方面。“重点论”——要着重把握主要矛盾、矛盾的主要方面，并以此作为解决问题的出发点。看问题既要全面地看，又要看主流、大势、发展趋势。</p><p>第三，方法论：①矛盾的特殊性决定了事物的不同性质，把握矛盾的特殊性是科学认识事物的基础，也是解决矛盾的关键；②具体问题具体分析：马克思主义活的灵魂。</p><h4>相互联系（2018—2）</h4><ol><li>矛盾的普遍性即矛盾的共性，是无条件的、绝对的；矛盾的特殊性即矛盾的个性，是有条件的、相对的。</li><li>任何现实存在的事物的矛盾都是共性和个性的有机统一。</li><li>共性寓于个性之中，没有离开个性的共性，也没有离开共性的个性。</li><li>矛盾的共性和个性、绝对和相对的道理，是关于事物矛盾问题的精髓，是正确理解矛盾学说的关键。</li></ol><div class="callout"><b>政治素养：（普遍性与特殊性＝共性与个性＝一般与个别）</b><ol><li>个别一定与一般相联系而存在，个性在一定条件下能够转化为共性。</li><li>一般只能在个别中存在，只能通过个别而存在（一般寓于个别）。</li><li>任何个别（无论怎样）都是一般（如：张三、李四都是人）。</li><li>人的认识的一般规律：由认识个别上升到一般，再由一般到个别的辩证发展过程。</li></ol></div><h4>解决矛盾的方法</h4><ol><li>矛盾一方克服另一方。</li><li>矛盾双方同归于尽。</li><li>矛盾双方形成协同运动的新形式（比如，企业 A 和企业 B 合作）。</li><li>矛盾双方融合成一个新事物（比如，企业 A 和 B 合并成一个新的企业 C）。</li></ol><div class="callout"><b>易错点：</b><ol><li>矛盾双方可以调和（×，矛盾的斗争性是绝对的，不可调和）</li><li>矛盾双方可以融合（√，如相互竞争的企业合并）</li></ol></div><p>意义：是马克思主义普遍真理同各国的具体实际相结合的哲学基础。科学社会主义基本原则与中国特色社会主义就是共性和个性的关系。</p></div><div class="branch"><strong>考点 4：量变质变规律（状态和形式）</strong><h3>1. 概念</h3><p>（1）质：一事物区别于其他事物的内在规定性。①认识质是认识和实践的起点和基础，只有认识质才能区别事物；②质与事物的存在是直接同一的，量和事物存在不是直接同一的。</p><p>（2）量：事物的规模、程度、速度等可以用数量关系表示的规定性。①区分质是认识量的前提，考察量是认识质的深化；②只有精准地认识量，才能深刻地把握质；③认识事物的量是认识的深化和精确化。</p><p>（3）度：质和量统一于度。度是保持事物质的稳定性的数量界限，即事物的限度、幅度和范围。度的两端／极限叫关节点或临界点。方法论：防止“过”或“不及”，掌握适度的原则；坚持底线思维、底线原则（2011—1、2016—1）。</p><div class="callout"><b>易错点：</b><ol><li>事物的量与事物是直接同一的（×）</li><li>度就是事物量变的关节点、临界点（×）</li><li>考察量是认识质的前提，区分质是认识量的深化（×）</li><li>认识量是认识和实践的起点和基础（×）</li></ol></div><h3>2. 相互区别</h3><p>（1）量变：①事物数量的增减和组成要素排列次序的变动；②保持事物的质的相对稳定性的不显著变化，体现了事物发展渐进过程的连续性。</p><p>（2）质变：①事物性质的根本变化，是事物由一种质态向另一种质态的飞跃（即此物转化为他物）；②体现了事物发展渐进过程和连续性的中断。</p><div class="callout"><b>政治素养：</b>区分量变和质变的根本标志是事物的变化是否超出度。<br><b>易错点：</b>此物转化为他物体现了事物发展渐进过程的连续性（×，此物转化为他物，即事物的质变。质变体现了事物发展渐进过程和连续性的中断）。</div><h3>3. 相互联系</h3><p>（1）量变是质变的必要准备；（2）质变是量变的必然结果（2012—2）。二者相互渗透、相互依存、相互贯通：①在总的量变过程中有阶段性和局部性的部分质变；②在质变过程中也有旧质在量上的收缩和新质在量上的扩张；③量变质变规律体现了事物发展是渐进性和飞跃性的统一。</p><div class="callout"><b>政治素养：</b>量变引起质变，在新质的基础上，事物又开始新的量变，如此交替循环，构成了事物的发展过程。</div><h3>4. 方法论意义</h3><ol><li>当事物的发展处在量变阶段时，要踏踏实实做好日常工作，为未来重大改变作准备。</li><li>当质变来临的时候，要果断地、不失时机地抓住机遇，促成质变，使工作迈上新台阶。</li></ol></div></div>`,true,`<div class="actions"><button class="subtle" data-go="map-dialectics-7">← 上一张</button><span class="status">图谱第 8 页文字版</span><button class="subtle" data-go="map-dialectics-9">下一张：否定与辩证法范畴 →</button></div>`)}
function dialecticsMap9(){return header('思维导图','马原 · 唯物辩证法','map-dialectics-8')+sheet('map-dialectics-9',`<div class="eyebrow">第一篇 / 马克思主义基本原理 · 图谱第 9 页</div><h2>二、唯物辩证法</h2><div class="tree"><div class="branch"><strong>考点 5：否定之否定规律（方向和道路）</strong><h3>1. 辩证否定观</h3><p>（1）事物内部都存在：①肯定因素——维持现存事物存在的因素；②否定因素——促使现存事物灭亡的因素。</p><div class="callout"><b>政治素养：</b>任何事物内部都包含肯定的方面与否定的方面。</div><p>（2）内涵：①否定是事物的自我否定、自我发展，是事物内部矛盾运动的结果。②否定是事物发展的环节，是旧事物向新事物的转变，是从旧质到新质的飞跃。③否定是新旧事物联系的环节。④辩证否定的实质是“扬弃”：新事物对旧事物既批判又继承，既克服其消极因素又保留其积极因素。</p><div class="callout"><b>政治素养：</b><ol><li>形而上学否定观：否定是外在的否定、主观任意的否定；是绝对的否定，不包含肯定的否定。</li><li>辩证否定观：否定是事物的自我否定，不是事物之间相互否定和一物否定另一物；否定是包含肯定的否定，对现存事物的否定中包含着对未来事物的肯定。</li></ol></div><p>（3）方法论：①要求我们对待一切事物都要采取科学分析的态度；②既要把握住它的现存状态又要把握住它的发展趋向，反对简单地肯定一切或否定一切。</p><h3>2. 否定之否定规律</h3><p>（1）过程：经历事物自我发展的两次否定、三个阶段，即“肯定—否定—否定之否定”。①第一次否定使矛盾得到初步解决，而处于否定阶段的事物仍然具有片面性；②还要经过再次否定，即否定之否定，实现对立面的统一，使矛盾得到根本解决；③否定之否定阶段仿佛是向原来出发点的“回复”，但这是在更高阶段的“回复”。</p><p>（2）否定之否定过程：内容——自己发展自己、自己完善自己的过程；形式——波浪式前进或螺旋式上升的总趋势。</p><h3>3. 意义</h3><p>揭示了事物发展的前进性与曲折性的统一（2026—1）。</p><p>（1）前进性：①每一次否定都是质变，都把事物推到新阶段；②每一个周期都是开放的，前一个周期的终点是下一个周期的起点，不存在不被否定的终点。</p><p>（2）曲折性：①体现在回复性上，其中有暂时的停顿甚至倒退；②这表明，事物的发展不是直线式前进，而是螺旋式上升的。</p></div><div class="branch"><strong>考点 6：内容与形式</strong><h3>1. 内涵</h3><p>内容与形式是从构成要素和表现方式上反映事物的一对范畴。</p><h3>2. 区别</h3><p>内容：构成事物的一切要素的总和。<br>形式：把诸要素统一起来的结构或表现内容的方式。</p><h3>3. 联系</h3><p>（1）任何事物都是内容与形式的统一：①内容是事物存在的基础，对形式具有决定作用；有什么样的内容就有什么样的形式，内容发生变化，其形式也发生相应变化。②形式对内容具有反作用：适合内容的形式，对内容的发展起积极的推动作用；不适合内容的形式，对内容的发展起消极的阻碍作用。</p><p>（2）内容和形式不可分割：①任何内容都有一定的形式，任何形式也都有一定的内容；②同一内容有不同表现形式，同一形式可以表现不同内容。</p><div class="callout"><b>政治素养：</b><ol><li>形式对内容的反作用表明，形式具有相对独立性。这种相对独立性使得在内容与形式的关系中，同一内容可以通过多种形式来体现：①同一内容有不同表现形式，比如，春节可以放鞭炮、贴对联、买年货等；②同一形式可以表现不同内容，比如，鞭炮除了春节，结婚、丧事也可以放。</li><li>内容与形式的矛盾贯穿了事物发展过程的始终，从最初的基本适合到基本不适合，随着矛盾的解决，再到新的基本适合。</li></ol></div></div><div class="branch"><strong>考点 7：本质与现象</strong><h3>1. 内涵</h3><p>本质和现象是揭示事物内在联系和外在表现的一对范畴。</p><h3>2. 区别</h3><p>本质：事物的根本性质，是构成事物诸要素之间的内在联系；一般的、普遍的；相对稳定的；深藏事物内部，靠理性思维把握。</p><p>现象：事物的外部联系和表面特征，是事物本质的外在表现；个别的、具体的；多变易逝的；表面、外显的，靠感官感知。</p><h3>3. 联系</h3><p>（1）本质决定现象：现象的存在和变化归根到底依赖于本质。</p><p>（2）现象表现本质：本质总是通过一定的现象表现自己的存在。①真象：正面表现本质；②假象：反面、歪曲、颠倒表现本质。</p><div class="callout"><b>政治素养：</b><ol><li>现象包括真象和假象。因此，真象和假象都是客观现象，都表现事物的本质，都来源于本质。</li><li>错觉≠假象。错觉是主观的，假象是客观的。</li></ol><b>易错点：</b><ol><li>真象来源于本质，假象与本质无关，假象来源于错觉（×）</li><li>真象深藏于事物内部，假象外露于事物外部（×）</li><li>真象是真实的，假象是一种错觉（×）</li></ol></div></div><div class="branch"><strong>考点 8：原因与结果（2013—2）</strong><h3>1. 内涵</h3><p>原因和结果是揭示事物之间引起和被引起关系的一对范畴。</p><h3>2. 区别</h3><p>原因：引起某种现象的现象。<br>结果：被某种现象引起的现象。</p><p>在一个具体的因果联系中，原因就是原因，结果就是结果，原因在前，结果在后，二者不能混淆和颠倒。</p><h3>3. 联系：相互依存和相互转化</h3><ol><li>在事物因果联系的长链中，任何原因都必然引起一定的结果，没有“无果之因”。</li><li>任何结果都是由一定的原因引起的，没有“无因之果”。</li><li>一种现象在一种联系中是原因，在另一种联系中则可能是结果，反之亦然。</li></ol><div class="callout"><b>政治素养：</b><ol><li>因果联系是有时间顺序的，总是原因在前结果在后。</li><li>不是任何前后相继的现象都存在因果联系，必须看是否是引起和被引起的关系。</li></ol></div></div><div class="branch"><strong>考点 9：必然与偶然（2022 分析题考点）</strong><h3>1. 内涵</h3><p>必然与偶然是揭示事物产生、发展和衰亡过程中不同趋势的一对范畴。</p><h3>2. 区别</h3><p>（1）必然：事物联系和发展过程中确定不移的趋势，在一定条件下具有不可避免性。①形成原因：事物内部的根本矛盾；②表现形式：同类事物普遍具有的发展趋势；③事物发展中的地位和作用：支配地位，决定事物发展方向。</p><p>（2）偶然：事物联系和发展过程中不确定的趋势。①形成原因：非根本矛盾和外部条件；②表现形式：事物发展中的个别表现；③事物发展中的地位和作用：从属地位，对事物的发展起促进或延缓的作用。</p></div></div>`,true,`<div class="actions"><button class="subtle" data-go="map-dialectics-8">← 上一张</button><span class="status">图谱第 9 页文字版</span><button class="subtle" data-go="map-dialectics-10">下一张：现实与可能等 →</button></div>`)}
function dialecticsMap10(){return header('思维导图','马原 · 唯物辩证法','map-dialectics-9')+sheet('map-dialectics-10',`<div class="eyebrow">第一篇 / 马克思主义基本原理 · 图谱第 10 页</div><h2>二、唯物辩证法</h2><div class="tree"><div class="branch"><strong>考点 9：必然与偶然（续）</strong><h3>3. 联系</h3><p>（1）相互依存：①没有脱离偶然的必然。现实事物的发展，不通过偶然而只表现为纯粹必然的情况是不存在的；必然总是伴随着偶然，要通过偶然表现出来，并为自己开辟道路。②没有脱离必然的偶然。在似乎是偶然起支配作用的地方，实际上是必然起着决定性作用，并制约着偶然的作用形式及其变化。</p><p>（2）相互转化：对于某一过程是必然的东西，对另一过程就可能成为偶然的东西。</p><h3>4. 方法论</h3><p>重视事物发展的必然规律和发展趋势，并以此为依据制定我们的目标和计划；同时也要充分估计到各种偶然因素的作用，善于敏锐地识别和把握机遇。</p><div class="callout"><b>政治素养：</b>偶然因素是事物发展中不可忽视的影响因素（2024—2）。</div></div><div class="branch"><strong>考点 10：现实与可能</strong><h3>1. 内涵</h3><p>可能和现实是反映事物的过去、现在和将来关系的一对范畴。</p><h3>2. 区别</h3><p>（1）现实：指相互联系着的实际存在的事物的综合。现实是当下的客观存在，标志着事物的当前状况。</p><p>（2）可能：指包含在事物中、预示事物发展前途的种种趋势。可能是事物潜在的趋势，标志着事物的发展方向。</p><h3>3. 联系：相互转化</h3><ol><li>现实蕴藏着未来的发展方向，会不断产生新的可能。</li><li>可能包含着发展成为现实的因素和根据，一旦主客观条件成熟，可能就会转化为现实。</li><li>发展就是现实和可能相互转化的过程。</li></ol><div class="callout"><b>政治素养：</b><ol><li>可能性和不可能性：现实中有无条件和根据。</li><li>现实可能和抽象可能：现实中的根据和条件是否充分（如：大海捞针是抽象的可能；为长者折枝是现实的可能）。</li></ol><b>易错点：</b><ol><li>只有对人有利的可能性才会转化为现实（×）</li><li>只要发挥主观能动性，可能就会转变为现实（×）</li><li>任何想象都会变为现实（×，只有可能才会变为现实）</li><li>可能性与不可能性相互转化（×，可能与现实才会相互转化）</li></ol></div></div><div class="branch"><strong>考点 11：唯物辩证法本质上是批判的和革命的</strong><h3>马克思</h3><ol><li>辩证法对现存事物的肯定理解中同时包含对现存事物否定的理解，即对现存事物的必然灭亡的理解。</li><li>辩证法对每一种既成的形式都是从不断的运动中，因而也是从它的暂时性方面去理解。</li><li>辩证法不崇拜任何东西，按其本质来说，它是批判的和革命的。</li></ol><h3>恩格斯</h3><ol><li>不存在任何最终的东西、绝对的东西、神圣的东西。</li><li>它（辩证法）指出一切事物的暂时性。</li><li>在它（辩证法）面前，除了生成和灭亡的不断过程、无止境地由低级上升到高级的不断过程，什么都不存在。</li></ol></div><div class="branch"><strong>考点 12：客观辩证法与主观辩证法</strong><ol><li>客观辩证法：是指客观事物或客观存在的辩证法，各种物质形态的辩证运动和发展规律。</li><li>主观辩证法：是指人类认识和思维运动的辩证法，以概念作为思维细胞的辩证思维运动和发展规律。</li><li>关系：①主观辩证法是客观辩证法在人类思维中的反映，二者本质上是统一的，但在表现形式上不同；②客观辩证法采取外部必然性形式，不以人的意志为转移，是物质世界本身的联系和发展；③主观辩证法采取观念的、逻辑的形式，是同人类思维的自觉活动相联系的，是以概念为基础的辩证思维规律。</li></ol><div class="callout"><b>政治素养：</b>主观辩证法和客观辩证法是反映和被反映的关系。</div></div><div class="branch"><strong>考点 13：唯物辩证法是科学的认识方法（2014、2015 分析题考点）</strong><ol><li>矛盾分析方法是对立统一规律在方法论上的体现，在唯物辩证法的方法论体系中居于核心地位，是认识事物的根本方法。</li><li>矛盾分析方法的核心要求是善于分析矛盾的特殊性，做到具体矛盾具体分析，对具体情况、具体问题作具体分析。</li><li>坚持问题导向，是习近平新时代中国特色社会主义思想的重要方法，是辩证唯物主义矛盾观点和矛盾分析方法的时代表达和时代升华。</li></ol></div><div class="branch"><strong>考点 14：学习唯物辩证法，不断增强思维能力</strong><h3>1. 辩证思维能力（2016、2022 分析题考点）</h3><p>（1）以唯物辩证法为指导，发现矛盾、分析矛盾、解决矛盾，把握本质、遵循规律、指导实践的能力。</p><p>（2）辩证思维方法：</p><ul><li>归纳与演绎：①人类思维从个别到一般，又由一般到个别的最常见的推理形式；②归纳和演绎处于不可分割的联系之中，它们互为前提，又相互补充。</li><li>分析与综合：①是一种比归纳与演绎更深刻地揭示事物本质的方法；②分析是综合的基础，综合是分析的完成。</li><li>抽象与具体：①是通过从具体到抽象、又从抽象到具体（具体—抽象—具体）的过程，达到对事物的真理性认识；②具体包括感性具体和思维具体两种，抽象是对客观事物某一方面本质的概括和规定；③对辩证思维而言，重要的是从抽象上升到具体。这是一个以抽象为逻辑起点，通过各种形式的逻辑中介，达到以思维具体为逻辑终点的运行过程。</li><li>逻辑与历史：逻辑的东西和历史的东西是辩证统一的（2025—2）。</li></ul><h3>2. 历史思维能力</h3><ol><li>历史思维能力是辩证思维与历史眼光的结合，是马克思主义科学历史观的具体表现和实践运用。</li><li>历史思维能力是以史为鉴、知古鉴今，善于运用历史眼光认识发展规律、把握前进方向、指导现实工作的能力。</li><li>历史、现实、未来是相通的（2023—1），历史是过去的现实，现实是未来的历史。</li></ol><h3>3. 系统思维能力（2023 分析题考点、2025—1）</h3><ol><li>系统是指由相互联系、相互作用的若干要素组成的具有稳定结构和特定功能的有机整体，具有整体性、结构性、层次性和开放性四个基本特征。</li><li>系统思维能力就是从事物相互联系的各个方面及其结构和功能进行系统思考的能力，就是全面系统地分析和处理问题的能力。</li><li>提高系统思维能力，就是要坚持系统观念，用系统思维的方法分析和处理问题。</li></ol><h3>4. 战略思维能力</h3><p>强调思维的整体性、全局性、长期性，是高瞻远瞩、统揽全局，善于把握事物发展总体趋势和方向的能力。</p><h3>5. 底线思维能力</h3><p>底线思维是我们在认识世界和改造世界的过程中，根据我们的需要和客观的条件，划清并坚守底线，尽力化解风险，避免最坏结果，同时争取实现最大期望值的一种积极的思维。</p><h3>6. 创新思维能力（2020 分析题考点）</h3><p>是对常规思维的突破，是破除迷信、超越陈规，善于因时制宜、知难而进、开拓创新的能力。</p></div></div>`,true,`<div class="actions"><button class="subtle" data-go="map-dialectics-9">← 上一张</button><span class="status">图谱第 10 页文字版</span><button class="subtle" data-go="map-practice-11">下一张：实践与认识 →</button></div>`)}
function practiceMap11(){return header('思维导图','马原 · 实践与认识','map-dialectics-10')+sheet('map-practice-11',`<div class="eyebrow">第一篇 / 马克思主义基本原理 · 图谱第 11 页</div><h2>三、认识论：实践与认识</h2><p class="lead">按原图第 11 页整理，保留考点、分支和旁注。</p><div class="tree"><div class="branch"><strong>考点 1：科学的实践观及其意义</strong><h3>1. 马克思《关于费尔巴哈的提纲》</h3><p>包含新世界观天才萌芽的第一个文件，系统论述了实践的观点，揭示了科学实践观的基本内容。</p><h3>2. 科学的实践观</h3><p>科学实践观从主观和客观、主体和客体的统一中把握实践，深刻揭示出实践与认识的发展规律，形成了完整科学的理论体系。</p><h3>3. 科学实践观的意义</h3><ol><li>克服了旧唯物主义的根本缺陷，为辩证唯物主义的创立奠定了科学的理论基础。</li><li>揭示了实践对认识的决定作用，为能动的、革命的反映论的创立奠定了科学的理论基础。</li><li>在人类思想史上第一次揭示了社会生活的实践本质，为唯物史观的创立奠定了科学的理论基础。</li><li>为人们能动地认识世界和改造世界提供了基本的思想方法和工作方法。</li></ol><div class="callout"><b>政治素养：</b><ol><li>实践性是马克思主义理论区别于其他理论的根本特征。</li><li>实践的观点是马克思主义的基本观点。</li><li>实践的发展过程：①是一个范围不断扩大、程度不断加深、效果不断提升的过程；②是一个从低级到高级、从简单到复杂、从自发到自觉的过程；③是一个改造客观世界和改造主观世界相互促进的过程；④是一个逐步走向真善美相统一、最终实现人的自由而全面发展的过程。</li></ol></div></div><div class="branch"><strong>考点 2：实践的本质与基本结构</strong><h3>1. 本质</h3><p>人类能动地改造世界的社会性的物质活动（2011—17）。</p><h3>2. 基本特征</h3><p>（1）客观实在性：实践是人类改造世界的客观物质活动，它虽然是人类有目的、有意识的行为，但本质上是客观的、物质的活动。①实践的主体、客体和中介，都是可感知的客观实在；②实践的水平、广度、深度和发展过程，都受客观条件的制约和客观规律的支配；③实践能够引起客观世界的某种变化，可以把人脑中观念的存在变为现实的存在；④实践的这一特征，把它同人的主观认识活动区别开来。</p><div class="callout"><b>政治素养：</b>实践的直接现实性是它的客观实在性的具体表现，实践不是纯粹的精神活动。<br><b>易错点：</b>人的能动的意识活动具有直接现实性（×）。</div><p>（2）自觉能动性：人的实践活动是一种有目的、有意识的活动。①目的性是能动性的主要表现；②人的实践活动结束时得到的结果，在这个过程开始时就作为目的在实践者头脑中以观念的形式存在着，目的决定着实践者的行为。</p><div class="callout"><b>政治素养：</b>马克思对此形象地比喻道：“最蹩脚的建筑师从一开始就比最灵巧的蜜蜂高明的地方，是他在用蜂蜡建筑蜂房以前，已经在自己的头脑中把它建成了。”所以实践是人的自觉能动的活动。</div><p>（3）社会历史性：①实践从一开始就是社会性的活动。作为实践主体的人总是处在一定社会关系中，任何人的活动都离不开与社会的联系。②实践的社会性决定了它的历史性。实践的内容、性质、范围、水平以及方式都受一定社会历史条件的制约，随着一定社会历史条件的变化而变化，因此，实践又是历史地发展着的实践。</p><h3>3. 基本结构（2017—17）</h3><p>（1）基本要素：</p><ol><li>主体：具有一定的主体能力、从事现实社会实践活动的人，是实践活动中自主性和能动性的因素。实践主体的能力包括自然能力和精神能力；精神能力包括知识性因素（首要能力）：理论知识、经验知识，和非知识性因素：情感、意志等。</li><li>客体：实践活动所指向的对象（实践客体≠客观存在的事物）。客观事物只有在被纳入主体实践活动的范围之内、为主体实践活动所指向并与主体相互作用时才成为现实的实践客体。</li><li>中介：各种形式的工具、手段及运用、操作这些工具、手段的程序和方法。分类：物质性工具系统，例如，火车、电脑分别是对人的腿、脑功能的延伸和放大；语言符号工具系统。实践的主体和客体正是依靠中介系统才能够相互作用。</li></ol><div class="callout"><b>易错点：</b><ol><li>实践客体是一切客观事物（×）</li><li>科学技术正在取代劳动者成为实践的主体（×）</li><li>实践的中介系统是实践中自主性和能动性的因素（×，自主性和能动性的因素是主体）</li></ol></div><p>（2）关系：实践的主体和客体相互作用的关系包括实践关系（最根本的关系）、认识关系、价值关系。</p><p>（3）主体客体化和客体主体化：①主体客体化：人通过实践使自己的本质力量作用于客体，使其按照主体的需要发生结构和功能上的变化，形成了世界上本来不存在的对象物。人类一切实践活动的结果都是主体客体化的结果。②客体主体化：客体从客观对象的存在形式转化为主体生命结构因素或主体本质力量的因素，客体失去客体性的形式，变成主体的一部分（如：电脑→人脑；汽车→人的脚）。</p><h3>4. 实践的基本形式</h3><p>三种基本类型：（1）物质生产实践：①是人类最基本的实践活动；②构成全部社会生活的基础。（2）社会政治实践：是处理各种政治关系的实践，主要指人们的政治活动。（3）科学文化实践：①是创造精神文化产品的实践活动，具有各种不同的形式，其中重要的形式有科学、艺术、教育等活动；②精神文化的生产不是一个纯粹的意识过程。</p><p>新的实践形式——虚拟实践：（1）虚拟实践是伴随信息化和网络化发展而产生的；（2）是实践活动的派生形式，同时又对现实的实践活动产生重大影响；（3）虚拟实践的实质是主体和客体之间通过数字化中介系统在虚拟空间进行的双向对象化的活动，主要活跃于网络世界，具有交互性、开放性、间接性等特点。</p><div class="callout"><b>政治素养：</b><ol><li>人类的任何实践形式无疑都离不开意识活动，但一种活动能否被称为实践活动，关键是看它是否超出了纯粹的意识活动，是否改变了除实践主体的意识状态之外的其他存在物的状态。</li><li>教育是一种科学文化实践活动，教育者的教学活动并不是纯粹的意识活动，而是通过教书育人的全过程实际地改变受教育者的存在状态。</li><li>社会政治实践和科学文化实践在物质生产实践基础上产生和发展，受物质生产实践的制约并对其产生能动的反作用。</li></ol><b>易错点：</b>科学文化实践只能通过虚拟实践的方式实现（×）。</div></div><div class="branch"><strong>考点 3：实践对认识的决定作用（2016 年分析题考点）</strong><h3>1. 实践是认识的来源（2015—1）</h3><p>（1）认识的内容是在实践活动的基础上产生和发展的。（2）直接经验：一切真知都是从直接经验发源的；任何知识都不能离开直接经验。“尽信书，则不如无书”“纸上得来终觉浅，绝知此事要躬行”。（3）间接经验：一个人大多数知识还是来自间接经验（书本和传授中得来）；间接经验归根到底也来自实践，来自别人的实践。“吾生也有涯，而知也无涯”。</p><h3>2. 实践是认识发展的动力（2024—3、2026—18、2026—19）</h3><ol><li>实践的需要推动认识的产生和发展，推动人类的科学发现和技术发明，推动人类的思想进步和理论创新。</li><li>实践为认识的发展提供了手段和条件。比如，人可以制造工具和使用工具日益深化对客观世界的认识。</li><li>更为重要的一点是，实践改造人的主观世界，锻炼和提高了人的认识能力。</li></ol><h3>3. 实践是认识的目的</h3><p>人们获得认识，不是为认识而认识，其最终目的是为实践服务、指导实践，以满足人们生活和生产的需要。</p><h3>4. 实践是检验认识真理性的唯一标准</h3><p>认识是否具有真理性，既不能从认识本身得到证实，也不能从认识对象中得到回答，只有在实践中才能得到验证。</p><div class="callout"><b>易错点：</b><ol><li>实践是在认识活动的基础上产生和发展的（×，说反了）</li><li>直接经验比间接经验更有用／实践比认识更重要（×，都有用且都重要）</li><li>实践水平的提高有赖于认识水平的提高（×，说反了。实践决定认识，所以是认识随着实践的发展而发展，认识水平的提高依赖于实践）</li><li>实践高于认识；认识是实践的先导／指导（√，实践决定认识，认识指导实践）</li><li>认识总是落后于实践（×，认识具有相对独立性，具体的认识过程可以与一定的实践不完全同步进行，比如预测、假说和规划就是先于实践的）</li><li>人们感觉器官的局限性／选择性是人认识能力的界限（×，人们可以制造工具为认识的发展提供条件，实践工具可以帮助人们突破感官的自然极限）</li></ol><b>政治素养：</b>认识／理论对实践的指导有正确和错误的区分：①正确的认识→促进实践的发展；②错误的认识→阻碍实践的发展。</div></div></div>`,true,`<div class="actions"><button class="subtle" data-go="map-dialectics-10">← 上一张</button><span class="status">图谱第 11 页文字版</span><button class="subtle" data-go="map-cognition-12">下一张：认识的本质与过程 →</button></div>`)}
function cognitionMap12(){return header('思维导图','马原 · 认识的本质与过程','map-practice-11')+sheet('map-cognition-12',`<div class="eyebrow">第一篇 / 马克思主义基本原理 · 图谱第 12 页</div><h2>三、认识论：认识的本质与过程</h2><div class="tree"><div class="branch"><strong>考点 4：认识的本质</strong><h3>1. 唯物主义反映论与唯心主义先验论的对立</h3><ol><li>唯心主义先验论：认识先于人的实践经验。认识路线：思想和感觉→物。</li><li>唯物主义反映论：认识是主体对客体的反映。认识路线：物→感觉和思想。</li></ol><div class="callout"><b>政治素养：（唯心主义先验论）</b><ol><li>主观唯心主义：认识是主观自生的。</li><li>客观唯心主义：认识是上帝的启示或某种客观精神的产物。</li><li>先验论否认了认识的客观来源，认为认识先于人的实践经验。</li></ol></div><h3>2. 旧唯物主义和现代辩证唯物主义的对立</h3><p>（1）旧唯物主义——直观反映论：以感性直观为基础，把人的认识看成消极地、被动地反映和接受外界对象。</p><p>缺陷：①离开实践考察认识问题，不了解实践对认识的决定作用。②离开辩证法考察认识问题：第一，把复杂的认识过程简单化，把多方面的认识要素片面化；第二，最根本的是它看不到主观和客观之间的矛盾及其相互作用，没有把认识看作一个不断发展的过程，认为认识是一次性完成的。</p><p>（2）辩证唯物主义——能动反映论：是建立在实践基础上的能动的反映论。两个突出特点：①把实践的观点引入认识论；②把辩证法应用于反映论考察认识的发展过程。</p><div class="callout"><b>政治素养：</b>坚持以科学的社会实践为特征的实践观，即实践是人类能动地改造世界的社会性的物质活动。这是马克思主义认识论即辩证唯物主义认识论与唯心主义认识论、旧唯物主义认识论的根本区别。</div><h3>3. 认识的本质</h3><p>（1）定义：主体在实践基础上对客体的能动反映。认识是主体与客体相互作用的过程和结果。</p><p>（2）特点：①反映特性：认识的反映特性是人类认识的基本规定性，指人的认识必然要以客观事物为原型和摹本，在思维中再现或摹写客观事物的状态、属性和本质。②能动的创造特性：认识是一种在思维中的能动的、创造性的活动，而不是主观对客观对象简单、直接的描摹或照镜子式的原物映现。③反映特性和能动的创造特性，二者不可分割。反映和创造不是人类认识的两种不同的本质，而是同一本质的两个不同的方面。</p><div class="callout"><b>易错点：</b><ol><li>认识是一种主观自生的东西（×）</li><li>认识结果完全是由主体决定的（×）</li><li>人的认识结果取决于主体的心理感受（×）</li><li>认识结果由认识客体决定，但也受到认识主体的影响（√）</li></ol></div></div><div class="branch"><strong>考点 5：认识运动的两次飞跃</strong><h3>1. 第一次飞跃：从实践到认识（2024 分析题考点）</h3><p>在实践基础上，从感性认识能动地飞跃到理性认识。</p><h4>（1）区别</h4><p>感性认识（初级阶段）：感觉器官；事物现象、外部联系、事物的各个方面。①三种形式：感觉、知觉、表象；②突出特点：直接性、具体性；③具有不深刻的局限性。</p><p>理性认识（高级阶段）：抽象思维；事物本质、全体、内部联系和事物自身规律。①三种形式：概念、判断、推理；②特点：间接性、抽象性；③深刻性。</p><div class="callout"><b>政治素养：</b><ol><li>感觉（如视觉、听觉、触觉），是感性认识也是整个认识过程的起始环节。</li><li>感性认识与理性认识的三种形式（由低到高）：①感性认识：感觉（起始环节）→知觉→表象（感性认识的高级形式）；②理性认识：概念（思维的细胞、最基本的思维形式）→判断→推理。</li><li>不管是感性认识还是理性认识都属于认识，只要是认识，都来源于实践（实践决定认识，认识来源于实践）。</li></ol></div><h4>（2）联系</h4><p>相互依存：①理性认识依赖于感性认识。感性认识是认识过程的起点，是达到理性认识的必经阶段，没有感性认识，就没有理性认识。②感性认识有待于发展和深化为理性认识。感性认识是认识的初级阶段，是对事物外部联系的认识；感性认识还不能达到对事物的本质和规律的认识，因而还不是完全的认识。</p><div class="callout"><b>易错点：</b>规律可以通过感觉器官感知（×）。</div><p>相互包含：①感性中有理性：人的感觉是渗透着理性的感觉；②理性中有感性：理性不仅以感性材料为基础，而且也以文字符号等感性形式的语言作为表达手段。A 中有 B，强调的是 B 的作用。</p><div class="callout"><b>政治素养：</b>“感觉到了的东西，我们不能立刻理解它，只有理解了的东西才更深刻地感觉它。”这段话形象地证明了感性认识上升为理性认识的重要性，以及二者关系的交融性。</div><h4>（3）两者统一于实践</h4><p>不论感性认识还是理性认识都是来自实践。不能割裂两者联系：①唯理论片面夸大理性认识的作用，犯“教条主义”错误；②经验论片面夸大感性认识的作用，犯“经验主义”错误。</p><div class="callout"><b>易错点：</b><ol><li>感性认识来源于感性具体，理性认识来源于抽象思维／理性具体（×，只要是认识，都来源于实践）</li><li>感性认识不重要，理性认识才重要（×，都重要）</li></ol></div><h4>（4）从感性认识上升到理性认识，必须具备两个基本条件</h4><p>第一，投身实践，深入调查，获取十分丰富和合乎实际的感性材料。第二，经过思考的作用，将丰富的感性材料加以去粗取精、去伪存真、由此及彼、由表及里的处理加工。</p><div class="callout"><b>易错点：</b>感性认识不断丰富自然会产生正确的理性认识（×，感性认识上升为理性认识，需要具备一定的条件，并非自然而产生）。</div><h4>（5）理性因素和非理性因素</h4><p>①理性因素：含义——人的理性直观、理性思维能力；作用——指导、解释、预见，在认识中起主导作用。②非理性因素：含义——人的情感、意志，如联想、想象、猜测、直觉、顿悟、灵感等；作用——激活、驱动（2026—19）。</p><div class="callout"><b>政治素养：</b><ol><li>感性认识≠非理性因素；理性认识≠理性因素。</li><li>认识活动是一个复杂的运动过程，表现为无论在感性认识中还是在理性认识中，都有非理性因素的作用，也都有理性因素的作用。</li><li>我们既要重视非理性因素的积极作用，又要注意防止非理性因素对人类认识的消极影响。</li></ol></div><h3>2. 第二次飞跃：从认识到实践</h3><p>（1）第二次飞跃比第一次飞跃更重要：①从实践的角度：认识世界的目的是改造世界（指导实践）。理性认识回到实践的过程，既是理论指导实践的过程，又是理论实现自身的过程。②从认识的角度：认识的真理性只有在实践中才能得到检验和发展。</p><div class="callout"><b>易错点：</b><ol><li>感性认识包含错误，理性认识则完全正确（×，感性认识和理性认识都是认识，而认识是否正确，只有在实践中才能得到检验和发展）</li><li>探索未知世界是认识世界的最终目的（×，最终目的是改造世界）</li></ol></div><p>（2）如何实现第二次飞跃？需要经过一定的中介环节：①确定实践目的、形成实践理念、制定实践方案、进行中间实验、运用科学的实践方法；②最后一个环节，是对人民群众进行组织和宣传，让理论为群众所掌握，并转化为改造世界的物质力量。</p></div></div>`,true,`<div class="actions"><button class="subtle" data-go="map-practice-11">← 上一张</button><span class="status">图谱第 12 页文字版</span><button class="subtle" data-go="map-cognition-13">下一张：认识的辩证运动与真理 →</button></div>`)}
function cognitionMap13(){return header('思维导图','马原 · 认识的辩证运动与真理','map-cognition-12')+sheet('map-cognition-13',`<div class="eyebrow">第一篇 / 马克思主义基本原理 · 图谱第 13 页</div><h2>三、认识论：认识的过程与真理</h2><div class="tree"><div class="branch"><strong>考点 6：实践与认识的辩证运动及其规律</strong><h3>1. 辩证认识过程（总规律）（2023 分析题考点）</h3><p>（1）规律：由感性认识到理性认识，又由理性认识到实践的飞跃，是实践、认识、再实践、再认识，循环往复以至无穷的辩证发展过程。</p><p>（2）过程：认识是一个反复循环和无限发展的过程。这个过程：既是认识在实践基础上沿着科学性方向不断深化发展的过程，也是实践在认识的指导下沿着合理性方向不断深入推进的过程。</p><p>（3）形式：不是封闭式的循环，也不是直线式的发展，是一个波浪式前进和螺旋式上升的过程。</p><div class="callout"><b>易错点：</b>认识运动是一种直线式的发展过程（×）。</div><h3>2. 实践和认识</h3><p>（1）说它“完成了”是针对具体事物的认识而言。（2）说它“又没有完成”是针对实践和认识运动过程的向前推移、向前发展而言的。（3）认识受主客观条件的限制，需要多次反复：①主观条件：人的认识能力受到科学技术条件限制，是有限度的；②客观条件：客观事物的本质属性和规律暴露需要一个过程。</p><div class="callout"><b>易错点：</b><ol><li>认识的反复性决定了客观事物的复杂性（×，说反了）</li><li>认识总是要受到主客观条件的限制（√）</li><li>物质这一客观实在是可以被认识的对象（√）</li><li>人们对事物的认识受到具体实践水平的限制（√，客观事物的复杂性决定了认识的反复性）</li></ol></div><h3>3. 认识和实践的具体的历史的统一</h3><p>（1）具体的：主观认识要与一定时间、地点、条件下的客观实践相符合。（2）历史的：主观认识要同特定历史发展阶段的客观实践相符合。（3）由于客观实践是具体的、历史的，所以主观认识也应当是具体的、历史的。</p><div class="callout"><b>错误观点：</b>①实践超前于认识：冒进主义（“左”的错误）；②实践落后于认识：保守主义（右的错误）。</div></div><div class="branch"><strong>考点 7：真理</strong><h3>1. 真理</h3><p>（1）含义：真理是标志主观与客观相符合的哲学范畴，是对客观事物及其规律的正确反映。（2）真理内容是客观的，形式是主观的。</p><div class="callout"><b>易错点：</b><ol><li>真理具有客观性，因此真理就是客观实在（×，真理的内容客观，形式主观）</li><li>真理就是客观规律，客观规律就是真理（×，真理是对客观事物及其规律的正确反映）</li></ol></div><h3>2. 客观性</h3><p>（1）真理是不是客观的，这是真理观中的首要问题。（2）真理的客观性：内容是客观的，包含着不依赖于人和人的意识的客观内容。（3）客观性是真理的本质属性：①真理具有客观性，但是真理不等同于客观事物；②真理具有主观形式，但是真理不是主观的产物；③真理固然是有用的，但有用的不都是真理。（4）真理是客观的，凡真理都是客观真理，这是真理问题上的唯物论。</p><div class="callout"><b>政治素养：（唯心主义真理观）：常为干扰选项</b><ol><li>休谟认为真理是“观念与主体感觉相符合”。</li><li>贝克莱断言“真理存在于观念之中”。</li><li>康德认为“真理是思维与它的先验形式相一致”。</li><li>柏拉图认为“真理是某种超验的、永恒的‘理念’”。</li><li>黑格尔说“真理是‘绝对理念’的自我显现”。</li><li>凡是多数人承认的就是真理，如贝克莱“集体知觉”。</li><li>有用的就是真理，以“有用”或“效果”为标准。</li></ol></div><h3>3. 一元性</h3><p>（1）一元性指在同一条件下对于特定的认识客体的真理性认识只有一个，而不可能有多个。（2）同一条件下人们对同一客观事物的多种不同认识中只有一种属于真理性的认识，即与特定的认识客体的状态、本质和规律相一致的认识才是真理。（3）真理是内容上的一元性与形式上的多样性的统一。</p><div class="callout"><b>政治素养：</b><ol><li>认识是多元的，但真理是一元的：认识有正确的、错误的，所以认识是多元的；只有正确的那一种认识才是真理（即主观与客观相符合），所以真理是一元的。</li><li>真理的一元性是针对真理的客观内容而言，因为真理的表现形式是多样的。如：物理定律可以用文字、数学公式或图形等多种形式表现。</li></ol></div><h3>4. 真理的绝对性和相对性</h3><p>（1）真理既具有绝对性，又具有相对性，是同一客观真理的两种属性，这是真理问题上的辩证法。注意：真理的两种属性≠两个真理。</p><h4>（2）区别</h4><p>绝对性：指真理主客观统一的确定性和发展的无限性。①主客观的相统一：任何真理都标志着主观与客观相符合，都包含着不依赖于人和人的意识的客观内容，都同谬误有原则的界限；承认了真理的客观性也就是承认了真理的绝对性。②人类认识按其本性：能够正确认识无限发展的物质世界，认识前进的每一步，都是对无限发展着的物质世界的接近，这也是绝对的、无条件的；承认世界的可知性也就是承认了真理的绝对性。</p><p>相对性：人们在一定条件下对客观事物及其本质和发展规律的正确认识总是有限度的、不完善的。①从客观世界整体看：任何真理都是对客观世界的某一阶段、某一部分的正确认识，认识有待扩展。②就特定事物而言：任何真理都只是对客观对象一定方面、一定层次和一定程度的正确认识，认识有待深化。</p><div class="callout"><b>政治素养：</b>真理的相对性不是推翻以前的真理，是在深度、完整度上进行深化。</div><h4>（3）联系</h4><p>从真理的两重性上看：相互依存，任何真理都既是绝对的，又是相对的；相互包含，绝对之中有相对，相对之中有绝对：①真理的绝对性寓于真理的相对性之中；②真理的相对性包含并表现着真理的绝对性，任何真理的相对性之中都包含着真理绝对性的颗粒。</p><p>从真理的发展上看：①人类的认识是一个不断深化的过程，永远处在由真理的相对性走向绝对性、接近绝对性的转化和发展过程中；②任何真理性的认识都是由真理的相对性向绝对性转化过程中的一个环节。</p><div class="callout"><b>易错点：</b><ol><li>真理是由相对到绝对再到相对的永无止境的过程（×）</li><li>追求真理是认识的最终目的（×，实践是认识的目的）</li></ol></div><p>（4）真理与人的认识能力的关系：真理的绝对性和相对性根源于人类认识世界的能力的无限性与有限性、绝对性与相对性的矛盾。人的思维能力：①思维的至上性、无限性、绝对性：全人类能够认识无限发展着的物质世界；②思维的非至上性、有限性、相对性：每一个人乃至每一代人认识世界的能力是有限的。</p><div class="callout"><b>政治素养：</b>人的认识能力、思维能力是无限性与有限性、绝对性与相对性的统一。作为人的正确认识成果的真理，也必然是绝对性和相对性的统一。</div><p>（5）不能割裂二者关系：①片面夸大真理的绝对性——绝对主义、思想僵化、教条主义；②片面夸大真理的相对性——诡辩论、不可知论、相对主义。</p><p>（6）马克思主义作为客观真理，是绝对性和相对性的统一：①马克思主义正确反映了人类社会的发展规律，因而具有绝对性；②马克思主义经典作家并没有穷尽真理，而是为不断寻求真理和发展真理开辟道路；马克思主义并没有穷尽对一切事物及其规律的认识，仍需要随着社会实践的发展而发展，因而又具有相对性。</p></div></div>`,true,`<div class="actions"><button class="subtle" data-go="map-cognition-12">← 上一张</button><span class="status">图谱第 13 页文字版</span><button class="subtle" data-go="map-cognition-14">下一张：真理与价值 →</button></div>`)}
function cognitionMap14(){return header('思维导图','马原 · 真理与价值','map-cognition-13')+sheet('map-cognition-14',`<div class="eyebrow">第一篇 / 马克思主义基本原理 · 图谱第 14 页</div><h2>三、认识论：真理与价值</h2><div class="tree"><div class="branch"><strong>考点 8：真理与谬误</strong><h3>1. 含义</h3><p>（1）谬误：同客观事物及其发展规律相违背的认识，是对客观事物及其发展规律的歪曲反映。（2）真理：是对客观事物及其规律的正确反映。真理与谬误区别：是否正确反映了客观事物及其规律。</p><h3>2. 对立统一</h3><p>（1）对立：在确定的对象和范围内，真理与谬误的对立是绝对的，与对象相符合的认识就是真理，与对象不相符合的认识就是谬误。真理和谬误有着原则界限。</p><p>（2）统一：超过这个范围，真理和谬误就会相互转化。真理与谬误的对立只是在非常有限的范围内才具有绝对的意义，超出这个范围，二者的对立就是相对的。</p><p>首先，真理在一定条件下会转化为谬误：①真理是具体的：任何真理都是在一定范围内、一定条件下才能够成立，超出这个范围，失去特定条件，就会变成谬误；②真理又是全面的：把全面的真理性认识组成的科学体系中的某个原理孤立地抽取出来，切断同其他原理的联系，也会使其丧失自己的真理性而变为谬误。</p><p>其次，谬误在一定条件下能够向真理转化：①错误往往是正确的先导，失败常常是成功之母，总结失败的教训，是获得真理、消除谬误的重要途径和方法；②勇于正视错误、反省错误、修正错误，让错误转化为正确，谬误转化为真理。</p><p>最后，在批判谬误中发展真理，是谬误向真理转化的另一种形式。</p><h3>3. 真理总是同谬误相比较而存在、相斗争而发展的</h3><div class="callout"><b>易错点：</b><ol><li>真理是抽象的／永恒不变的，实践是具体的（×，真理也是具体的、全面的、发展的）</li><li>真理是主体对客体的反映，谬误是主体自生的（×，谬误是主体对客体的歪曲反映）</li><li>真理是有用的，谬误是有害的（×）</li><li>真理在任何条件下都可以转化成谬误（×）</li></ol></div></div><div class="branch"><strong>考点 9：实践是检验真理的唯一标准（2019 分析题考点）</strong><h3>1. 为什么“唯一”</h3><p>（1）真理的本性决定（本性在于主观与客观相符合）：①主体的角度：主观认识本身不能自称正确，也不能成为检验真理的标准；②客体的角度：客观事物作为认识的对象，自身不可能回答人的认识是否同它相符合的问题。</p><p>（2）实践的特点决定：①实践具有直接现实性。实践的直接现实性是它的客观实在性的具体表现；②实践的直接现实性的品格，是实践能够成为检验真理唯一标准的主要根据。</p><h3>2. 逻辑证明</h3><p>（1）在实践检验真理的过程中，逻辑证明可以起到重要的补充作用。（2）逻辑证明是探索真理、论证真理的方式，是正确思维和表达的必要条件，也是建立科学理论体系的重要途径。</p><div class="callout"><b>政治素养：</b>已被逻辑证明了的东西，还必须经过实践的检验，并最终服从实践检验的结果。所以，逻辑证明也不能取代实践作为检验真理的标准。只有实践，才是检验真理的唯一标准。<br><b>易错点：</b>逻辑证明也是检验真理的标准（×）。</div><h3>3. 实践标准的确定性与不确定性</h3><p>（1）确定性：绝对性、唯一性。①实践是检验真理的唯一标准，此外再无别的标准。实践作为检验标准具有唯一性、归根到底性、最终性；②凡是经过实践证明了一切认识都是客观真理，都具有不可推翻的性质；③实践能够检验一切认识。即使对于有些认识，当前的实践不能检验，但不断发展着的实践终能验证它是否具有真理性。</p><p>（2）不确定性：相对性、条件性。①任何实践都会受到主客观条件的制约，因而都具有不可能完全证实或驳倒一切认识的局限性；②实践检验真理是一个发展过程，不是一次性完成的；③已被实践检验过的真理还需要继续经受实践的检验。</p><p>（3）坚持实践标准的确定性和不确定性的统一，就是坚持真理问题上的实践标准的辩证法。</p><div class="callout"><b>政治素养：</b><ol><li>客观事物的复杂性→决定了认识的反复性→决定了实践检验真理不是一次性完成。</li><li>事物是变化的、发展的，条件会变。所以，已被实践检验过的真理还需要继续经受实践的检验。</li></ol><b>易错点：</b><ol><li>所有的真理常常在实践中被推翻（×）</li><li>有些真理是根本无法通过实践检验的（×）</li></ol></div></div><div class="branch"><strong>考点 10：真理与价值（2017 分析题考点）</strong><h3>1. 价值及其基本特性（2024—18、2025—19）</h3><p>（1）价值：在实践基础上形成的主体和客体之间的意义关系。价值离不开主体的需要，也离不开客体的特性。构成：①主体的需要；②客体的特性。</p><div class="callout"><b>政治素养：（两种错误的价值论）</b><ol><li>客观主义价值论：价值是客体本身所固有的，而与主体无关。</li><li>主观主义价值论：价值就是主体的欲望、情感和兴趣，而与客体无关。</li></ol></div><p>（2）基本特性：</p><ul><li>主体性：始终以主体为中心。①依赖于主体的存在；②依赖于主体的创造，使客体的潜在价值转化为现实的价值。</li><li>客观性：在一定条件下客体对于主体的意义不依赖于主体的主观意识而存在。①主体的存在和需要是客观的，而不是抽象的；②客体的存在、属性及作用是客观的。客体能否满足主体需要，并不由人的主观愿望决定，而是由客体客观存在的性质、属性等决定；客体的价值及价值大小，取决于客体的属性及满足主体需要的程度。价值的主体性依赖于价值的客观性，价值的主体性是以价值的客观性为前提的。</li><li>多维性：①每个主体的价值关系具有多样性；②同一客体对主体的不同需要会产生不同的价值。</li><li>社会历史性：主体和客体的不断变化决定了价值的社会历史性。</li></ul><div class="callout"><b>政治素养：</b><ol><li>主体性≠主观性：主观指人的意识、思维所特有的状态和属性；主体指从事现实社会实践活动的人。</li><li>真理是一元的，价值是多元的，认识也是多元的。</li><li>主客体之间的价值关系不是一种自然的现成关系，而是主体在实践基础上建立的与客体之间的一种创造性关系。</li></ol></div></div></div>`,true,`<div class="actions"><button class="subtle" data-go="map-cognition-13">← 上一张</button><span class="status">图谱第 14 页文字版</span><button class="subtle" data-go="map-text:15">下一张：图谱第 15 页 →</button></div>`)}
function motionNote(){return header('物质、运动与时空','马原 · 运动观与时空观','notes')+sheet('note-motion',`<div class="eyebrow">学霸笔记 / 马原</div><h2>物质、运动与时空</h2><p class="lead">根据《27苏一〈学霸笔记〉》第 9—12 页整理 · 考点定位：选择题，理解</p><h3>01 / 从三个问题理解关系</h3><div class="tree"><div class="branch"><strong>世界的本原是什么？</strong><p>世界的本原是物质。</p></div><div class="branch"><strong>物质是怎样存在的？</strong><p>物质是运动着的；运动是物质的存在方式和根本属性。</p></div><div class="branch"><strong>运动着的物质在哪里存在？</strong><p>时间和空间是运动着的物质的基本存在形式。</p></div></div><h3>02 / 物质与运动</h3><p>运动是物质的运动，物质是运动的物质。物质是运动的承担者；物质和运动不可分割。</p><div class="callout">记忆时区分：运动是<b>物质</b>的存在方式；时间和空间是<b>运动着的物质</b>的基本存在形式。</div><h3>03 / 时空与时空观念</h3><div class="matrix"><div><b>时空 · 客观</b><br>时间和空间客观存在，不以人的意志为转移。</div><div><b>时空观念 · 主观</b><br>人对时空的认识和感受可以发生变化。</div></div><p>例如，同样一个小时，有时觉得过得很快，有时觉得过得很慢。客观时间与人的主观感受应当区分。</p><h3>04 / 有限与无限</h3><div class="matrix"><div><b>整个物质世界的时空</b><br>无限、绝对、无条件</div><div><b>具体事物的时空</b><br>有限、相对、有条件</div></div><p>时空的客观实在性是绝对的、无条件的。</p><h3>05 / 物质、运动和时空的统一</h3><div class="matrix"><div><b>物质</b><br>唯一特性：客观实在性</div><div><b>运动</b><br>绝对运动与相对静止</div><div><b>时间和空间</b><br>运动着的物质的基本存在形式</div><div><b>三者关系</b><br>内在统一，不可分割</div></div><p>物质运动总是在一定的时间和空间中进行；不存在脱离物质运动的“纯粹”时间和空间，也不存在脱离时间和空间的物质运动。</p><div class="callout">不要将时空理解成独立存在、等待物质放入的“贮藏所”；时空是物质运动的存在形式。</div>`,false,`<div class="actions"><button class="primary" id="startmotion">读完了，开始做题 →</button></div>`)}

if(id==='cpc13')excerpt=excerpt.replace('系统闸述','系统阐述');let opening=id==='opium'?`<h3>背景与进程</h3><p>1840—1842年第一次鸦片战争后，清政府被迫签订中英《南京条约》；此后列强通过一系列不平等条约攫取侵略特权。</p><h3>影响</h3><p>中国开始沦为半殖民地半封建社会。列强侵略破坏中国主权；外国资本主义侵入破坏自然经济基础，封建剥削关系仍占明显优势。</p><h3>考点</h3><p class="callout">1840年第一次鸦片战争是中国近代史的起点。近代中国的两对主要矛盾是帝国主义和中华民族的矛盾、封建主义和人民大众的矛盾；两大历史任务是争取民族独立、人民解放和实现国家富强、人民幸福。</p>`:'';let content=`<div class="eyebrow">历史节点 / ${esc(e.date)}</div><h2>${esc(e.title)}</h2><p class="lead">内容依据苏一《史纲毛中特时间轴》及《命题点高清图谱》；对应原图见下方。</p>${opening}<h3>主要内容与考点</h3>${eventRelatedBlocks(id)}${excerpt?`<h3>时间轴资料补充</h3><div style="white-space:pre-wrap;line-height:1.9">${esc(excerpt)}</div><p class="status">依据资料识别整理，存在识别错误时请以原资料为准。</p>`:''}<h3>相关图谱</h3><p>查看相关章节原图，结合标题定位本节点；该页也包含其他知识点。</p><p><button class="subtle" data-go="map-full:${n+5}">查看图谱相关章节（PDF 第 ${n+5} 页）→</button></p>`;return header('史纲毛中特时间轴','选择左侧节点，在右侧阅读与标记','timeline')+`<div class="timeline-layout">${rail}<section class="detail-panel"><div class="detail-intro"><strong>${esc(e.title)}</strong><span> · ${esc(e.date)}</span></div>${sheet('event-'+id,content)}</section></div>`}

function openEvent(id){
  const source=document.querySelector('.timeline');
  if(!source || matchMedia('(prefers-reduced-motion: reduce)').matches || !source.animate){go('event:'+id);return}
  const from=source.getBoundingClientRect(), ghost=source.cloneNode(true);
  Object.assign(ghost.style,{position:'fixed',left:from.left+'px',top:from.top+'px',width:from.width+'px',height:from.height+'px',margin:'0',zIndex:'30',pointerEvents:'none',overflow:'hidden'});
  document.body.appendChild(ghost);
  go('event:'+id);
  const rail=document.querySelector('.timeline-rail'), panel=document.querySelector('.detail-panel');
  if(!rail||!panel){ghost.remove();return}
  rail.animate([{opacity:0,transform:'translateX(24px)'},{opacity:1,transform:'translateX(0)'}],{duration:300,delay:100,easing:'ease-out',fill:'backwards'});
  panel.animate([{opacity:0,transform:'translateX(18px)'},{opacity:1,transform:'translateX(0)'}],{duration:320,delay:150,easing:'ease-out',fill:'backwards'});
  const anim=ghost.animate([{transform:'translateX(0)',opacity:1},{transform:'translateX(-56px)',opacity:0}],{duration:230,easing:'ease-in',fill:'forwards'});
  anim.onfinish=()=>ghost.remove();
  anim.oncancel=()=>ghost.remove();
}
function setupMarks(key){let svg=document.querySelector('#marks'),paper=document.querySelector('#sheet'),sizer=document.querySelector('#sizer');paper.querySelectorAll('img').forEach(img=>{if(!img.complete)img.addEventListener('load',()=>layout(),{once:true})});db.marks[key] ||= [];let arr=db.marks[key],current=null,erasing=false,changed=false,erasePrev=null;function layout(){let h=paper.offsetHeight;svg.setAttribute('viewBox',`0 0 720 ${h}`);sizer.style.width=(720*zoom)+'px';sizer.style.height=(h*zoom)+'px';paper.style.zoom=zoom;let z=document.querySelector('#zoom');if(z)z.textContent=Math.round(zoom*100)+'%'}function paint(){svg.innerHTML=arr.map((m,i)=>m.type==='text'?`<text data-i="${i}" x="${m.x}" y="${m.y}" fill="${esc(m.color)}">${esc(m.text)}</text>`:`<path data-i="${i}" d="${m.points.map((p,j)=>(j?'L':'M')+p[0]+','+p[1]).join(' ')}" stroke="${esc(m.color)}" stroke-width="${m.type==='high'?18:3}" opacity="${m.type==='high'?'.32':'1'}"/>`).join('');layout()}function pos(e){let rect=svg.getBoundingClientRect();return [Math.round((e.clientX-rect.left)*720/rect.width),Math.round((e.clientY-rect.top)*paper.offsetHeight/rect.height)]}document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{tool=b.dataset.tool;document.querySelectorAll('[data-tool]').forEach(x=>x.classList.toggle('active',x===b));svg.classList.toggle('read',tool==='read')});document.querySelector('#color').oninput=e=>color=e.target.value;document.querySelector('#clear').onclick=()=>{if(confirm('确定清除当前页的全部画线、涂画和备注吗？')){arr.length=0;save();paint()}};let less=document.querySelector('#smaller'),more=document.querySelector('#larger');if(less)less.onclick=()=>{zoom=Math.max(.7,Math.round((zoom-.1)*10)/10);layout()};if(more)more.onclick=()=>{zoom=Math.min(1.8,Math.round((zoom+.1)*10)/10);layout()};svg.onpointerdown=e=>{let p=pos(e);if(tool==='text'){let t=prompt('输入文字备注：');if(t&&t.trim()){arr.push({type:'text',x:p[0],y:p[1],text:t.trim(),color});save();paint()}return}if(tool==='erase'){e.preventD svg.onpointermove=e=>{if(erasing){e.preventDefault();let p=pos(e),distance=Math.hypot(p[0]-erasePrev[0],p[1]-erasePrev[1]),step=Math.max(1,10*720/svg.getBoundingClientRect().width),n=Math.ceil(distance/step);for(let k=1;k<=n;k++)eraseAt([erasePrev[0]+(p[0]-erasePrev[0])*k/n,erasePrev[1]+(p[1]-erasePrev[1])*k/n]);erasePrev=p;return}if(!current)return;e.preventDefault();current.points.push(pos(e));paint()};function end(){if(current){current=null;save()}if(erasing){erasing=false;if(changed)save();changed=false}}svg.onpointerup=end;svg.onpointercancel=end;paint();new ResizeObserver(layout).observe(paper)}render();
